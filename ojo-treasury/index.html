/* conversation layout: narration as text, speech as a bubble with the speaker's face */
const MOODLBL = {whisper:'whispers', sleepy:'sleepily', giggle:'giggles', scared:'scared', sad:'sadly', sulky:'grumbles', quiet:'quietly', brave:'bravely', stubborn:'insists', proud:'proudly'};
const LOUD = new Set(['excited', 'proud', 'stubborn', 'bright']), HUSHED = new Set(['whisper', 'sleepy', 'quiet']);
const AVC = {};
function avatar(w){
  if (AVC[w]) return AVC[w];
  const v = w === 'o' ? `<span class="mg-ojo">${OJO}</span>`
    : w === 'a' ? `<svg viewBox="57 124 86 86" aria-hidden="true">${ayu({x:100, y:300, s:1, mouth:'smile'})}</svg>`
    : `<svg viewBox="61 134 78 78" aria-hidden="true">${elder({kind:{j:'ajji', m:'amma', t:'auntie'}[w], x:100, y:300, s:1, eyes:w === 'j' ? 'smile' : 'open'})}</svg>`;
  return (AVC[w] = v);
}
function talkHTML(talk){
  return talk.map(([w, mood, text], i) => {
    if (w === 'n') return `<p class="nar" data-i="${i}">${words(text)}</p>`;
    const c = CAST[w], lbl = MOODLBL[mood];
    return `<div class="say${w === 'a' ? '' : ' r'}${LOUD.has(mood) ? ' loud' : ''}${HUSHED.has(mood) ? ' hushed' : ''}" data-i="${i}" style="--c:${c.c};--c2:${c.bg}"><span class="av av-${w}" aria-hidden="true">${avatar(w)}</span><div class="bub"><span class="nm">${c.name}${lbl ? ` <i>${lbl}</i>` : ''}</span><p>${words(text)}</p></div></div>`;
  }).join('');
}
const castRow = talk => { const ws = [...new Set(talk.map(l => l[0]).filter(w => w !== 'n'))]; return `<div class="cast-row"><span>In this story:</span>${ws.map(w => `<span class="cr" style="--c:${CAST[w].c};--c2:${CAST[w].bg}"><span class="av av-${w}" aria-hidden="true">${avatar(w)}</span>${CAST[w].name}</span>`).join('')}</div>`; };

/* speech bubbles in the picture */
const SB = {n:0, i:-1, step:-1, speech:[]};
function updTalk(){
  const t = document.getElementById('tbN'); if (!t) return;
  t.textContent = SB.step >= 0 ? `${SB.step + 1} of ${SB.speech.length}` : 'Tap the arrow';
}
function hideBubble(){
  const b = document.getElementById('sbub'); if (b) b.hidden = true; SB.i = -1;
  document.querySelectorAll('.story-body .say.pick').forEach(x => x.classList.remove('pick'));
}
function showBubble(i){
  const st = BOOK[SB.n - 1], b = document.getElementById('sbub'), stg = document.getElementById('stage');
  if (!st || !st.talk || !b || !stg) return;
  const [w, mood, text] = st.talk[i] || [];
  if (!w || w === 'n') return;
  const sc = st.sc, C = CAST[w];
  const anc = w === 'o' ? [sc.ox, sc.oy - sc.osz * .62] : (SPK[st.id] || {})[w];
  const W = stg.clientWidth, H = stg.clientHeight;
  b.style.fontSize = Math.max(12, Math.min(18, W * .043)) + 'px';
  b.style.setProperty('--c', C.c); b.style.setProperty('--c2', C.bg || '#fff');
  const av = b.querySelector('.sb-av'); av.className = `sb-av av av-${w}`; av.innerHTML = avatar(w);
  b.querySelector('.sb-nm').textContent = C.name;
  b.querySelector('.sb-say').textContent = smart(text.replace(/\*/g, ''));
  b.classList.toggle('hushed', HUSHED.has(mood)); b.classList.toggle('loud', LOUD.has(mood));
  b.classList.remove('below', 'off'); b.hidden = false; b.style.animation = 'none'; void b.offsetWidth; b.style.animation = '';
  const bw = b.offsetWidth, bh = b.offsetHeight;
  if (!anc){ b.classList.add('off'); b.style.left = (W * .04) + 'px'; b.style.top = (H * .05) + 'px'; }
  else {
    const ax = anc[0] / 100 * W, ay = anc[1] / 100 * H;
    let top = ay - bh - 12;
    if (top < 6){ top = ay + 12; b.classList.add('below'); }
    const left = Math.max(6, Math.min(W - bw - 6, ax - bw / 2));
    b.style.left = left + 'px'; b.style.top = top + 'px';
    b.style.setProperty('--tx', Math.max(18, Math.min(bw - 18, ax - left)) + 'px');
  }
  SB.i = i; const k = SB.speech.indexOf(i); if (k >= 0) SB.step = k; updTalk();
  document.querySelectorAll('.story-body .say.pick').forEach(x => x.classList.remove('pick'));
  const el = document.querySelector(`.story-body .say[data-i="${i}"]`); if (el) el.classList.add('pick');
}
addEventListener('resize', () => { if (SB.i >= 0) showBubble(SB.i); }, {passive:true});


/* ================= for the author: match a recording to the lines (#sync-N) ================= */
let SYNC = null;
addEventListener('keydown', e => { if (SYNC && SYNC.key) SYNC.key(e); });
function syncStop(){ if (!SYNC) return; try { SYNC.a.pause(); } catch (e) {} cancelAnimationFrame(SYNC.raf); SYNC = null; }
const mmss = t => { t = Math.max(0, t || 0); const m = Math.floor(t / 60), x = t - m * 60; return m + ':' + (x < 10 ? '0' : '') + x.toFixed(1); };
// where speech starts again after a pause: found once from the recording itself, so each tap lands on the true start
function findOnsets(buf){
  const d = buf.getChannelData(0), sr = buf.sampleRate, hop = Math.round(sr / 100), n = Math.floor(d.length / hop), db = new Float32Array(n);
  for (let i = 0; i < n; i++){ let q = 0; for (let j = i * hop, e = j + hop; j < e; j++) q += d[j] * d[j]; db[i] = 10 * Math.log10(q / hop + 1e-12); }
  const srt = Float32Array.from(db).sort(), thr = Math.max(srt[Math.floor(n * .1)] + 12, -55), out = [];
  let quiet = 0;
  for (let i = 0; i < n; i++){
    if (db[i] < thr){ quiet++; continue; }
    if (quiet >= 12 || out.length === 0) out.push({t:Math.max(0, i / 100 - .04), gap:quiet / 100});
    quiet = 0;
  }
  return out;
}
function renderSync(n){
  syncStop();
  const st = BOOK[n - 1], U = unitsOf(n), last = U.length - 1;
  world(st.bg1, st.bg2, st.board, false);
  const label = k => k === 0 ? 'the title' : k === last ? 'the Kannada line' : 'line ' + k;
  view.innerHTML = `<div class="sheet"><article class="gp sync" aria-labelledby="sy-h">
    <p class="sy-eye">For the author · this page is not part of the book</p>
    <h1 id="sy-h">Match your voice to Story ${n}</h1>
    <p class="lede">${esc(st.title)}. Your recording plays here, and you tap once as each line begins. Afterwards the words, faces and speech bubbles will follow your voice.</p>
    <ol class="sy-how">
      <li>Press <b>Start</b>. The line to listen for is marked in yellow.</li>
      <li>As soon as you hear that line begin, tap <b>Now</b> (or press the space bar). Don’t worry about tapping a little late: each tap moves back to where your voice starts.</li>
      <li>If you left a line out when recording, tap <b>Not recorded</b>. If you said a line differently, tap <b>Words changed</b> while it plays.</li>
    </ol>
    <div class="sy-bar">
      <button class="big" id="syGo">Start</button>
      <button class="sy-now" id="syNow" disabled>Now</button>
      <span class="sy-clock" id="syClock" aria-hidden="true">0:00.0</span>
      <span class="sy-small">
        <button class="pp2" id="syBack" disabled>Back one line</button>
        <button class="pp2" id="sySkip" disabled>Not recorded</button>
        <button class="pp2" id="syDiff" disabled aria-pressed="false">Words changed</button>
        <button class="pp2" id="sySlow" aria-pressed="false">Slower</button>
        <button class="pp2" id="syOver" disabled>Start over</button>
      </span>
    </div>
    <p class="sy-msg" id="syMsg" aria-live="polite"></p>
    <ol class="sy-list" id="syList">${U.map((u, i) => `<li data-k="${i}"><span class="sy-who" style="--c:${CAST[u.w].c}">${u.title ? 'Title' : CAST[u.w].name}</span><span class="sy-t"${u.kn ? ' lang="kn"' : ''}>${esc(u.t.replace(/\*/g, ''))}</span><span class="sy-at"></span></li>`).join('')}</ol>
    <section class="sy-done" id="syDone" hidden aria-labelledby="syd-h">
      <h2 id="syd-h">Every line is matched</h2>
      <p>Try it in the story first. When it looks right, copy the timings and paste them into your chat with Claude, so every reader gets the same match. Until then, only this device uses them.</p>
      <div class="row"><button class="big" id="syTry">Try it in the story</button><button class="big ghost dark" id="syCopy">Copy the timings</button></div>
      <textarea id="syCode" readonly rows="4" aria-label="The timings to paste"></textarea>
      <p class="sy-copied" id="syCopied" aria-live="polite"></p>
    </section>
  </article></div>`;
  const $s = id => document.getElementById(id);
  const a = new Audio(narrSrc(n)); a.preload = 'auto';
  const S = SYNC = {n, a, U, T:[0], skip:new Set(), diff:new Set(), on:null, raf:0, started:false, done:false};
  try {
    fetch(narrSrc(n)).then(r => r.arrayBuffer()).then(b => new OfflineAudioContext(1, 44100, 44100).decodeAudioData(b)).then(buf => { if (SYNC === S) S.on = findOnsets(buf); }).catch(() => {});
  } catch (e) {}
  const rows = [...document.querySelectorAll('#syList li')];
  const snap = tap => {
    let prev = 0; for (const x of S.T) if (x != null) prev = x;
    let best = null, bs = -1e9;
    if (S.on) for (const o of S.on){
      if (o.t <= prev + .15 || o.t < tap - 1.6 || o.t > tap + .2) continue;
      const sc = Math.min(o.gap, 1.2) * 1.4 - Math.abs(o.t - (tap - .45)) * .9;
      if (sc > bs){ bs = sc; best = o.t; }
    }
    return best != null ? best : Math.max(prev + .1, tap - .35);
  };
  const paint = () => {
    const k = S.T.length;
    rows.forEach((li, i) => {
      li.classList.toggle('done', i < k); li.classList.toggle('next', i === k && !S.done); li.classList.toggle('play', S.started && i === k - 1 && !S.done);
      li.classList.toggle('skip', S.skip.has(i)); li.classList.toggle('diff', S.diff.has(i));
      li.querySelector('.sy-at').textContent = i < k ? (S.skip.has(i) ? 'not recorded' : mmss(S.T[i] ?? 0)) : '';
    });
    $s('syNow').disabled = !S.started || S.done; $s('sySkip').disabled = !S.started || S.done;
    $s('syBack').disabled = !S.started || k <= 1; $s('syOver').disabled = !S.started;
    $s('syDiff').disabled = !S.started || S.done || k <= 1; $s('syDiff').setAttribute('aria-pressed', String(S.diff.has(k - 1)));
    const nx = rows[k]; if (nx && S.started) nx.scrollIntoView({block:'center', behavior:RM ? 'auto' : 'smooth'});
  };
  const finish = () => {
    S.done = true; $s('syGo').textContent = 'Play again';
    const T = S.T.map(x => +(+x).toFixed(2));
    try { localStorage.setItem('ojo-sync-' + n, JSON.stringify({t:T, at:Date.now()})); } catch (e) {}
    let code = `Story ${n} timings: ${T.map(x => x.toFixed(2)).join(', ')}`;
    if (S.skip.size) code += `\nNot recorded: ${[...S.skip].sort((x, y) => x - y).map(label).join(', ')}`;
    if (S.diff.size) code += `\nWords changed: ${[...S.diff].sort((x, y) => x - y).map(label).join(', ')}`;
    $s('syCode').value = code; $s('syDone').hidden = false; $s('syMsg').textContent = '';
    paint(); $s('syDone').scrollIntoView({block:'center', behavior:RM ? 'auto' : 'smooth'});
  };
  const fill = t => { for (let i = 0; i < S.T.length; i++) if (S.T[i] == null) S.T[i] = t; };
  const now = () => {
    if (!S.started || S.done) return;
    const t = snap(a.currentTime); fill(t); S.T.push(t);
    if (S.T.length > last) finish(); else paint();
  };
  const skip = () => {
    if (!S.started || S.done) return;
    S.skip.add(S.T.length); S.T.push(null);
    if (S.T.length > last){ fill(Math.max(0, (a.duration || a.currentTime) - .2)); finish(); } else paint();
  };
  const tick = () => { if (SYNC !== S) return; $s('syClock').textContent = mmss(a.currentTime); S.raf = requestAnimationFrame(tick); };
  a.addEventListener('ended', () => {
    if (SYNC !== S || S.done || !S.started) return;
    const left = last + 1 - S.T.length;
    if (left > 0){ $s('syMsg').innerHTML = `The recording ended with ${left} line${left > 1 ? 's' : ''} still to match. If you recorded ${left > 1 ? 'them' : 'it'}, tap <b>Back one line</b> and try again; if not, <button class="pp2" id="syRest">mark the rest as not recorded</button>.`; const r = $s('syRest'); if (r) r.addEventListener('click', () => { while (S.T.length <= last){ S.skip.add(S.T.length); S.T.push(null); } fill(Math.max(0, (a.duration || 0) - .2)); finish(); }); }
  });
  a.addEventListener('error', () => { if (SYNC === S) $s('syMsg').textContent = 'The recording could not be opened here. Try another browser, or ask Claude to check the file.'; });
  $s('syGo').addEventListener('click', () => {
    if (S.done){ a.currentTime = 0; a.play().catch(() => {}); return; }
    if (!S.started){ S.started = true; a.currentTime = 0; }
    if (a.paused){ a.play().then(() => { $s('syGo').textContent = 'Pause'; }).catch(() => { $s('syMsg').textContent = 'Tap Start again to play the recording.'; }); }
    else { a.pause(); $s('syGo').textContent = 'Carry on'; }
    cancelAnimationFrame(S.raf); S.raf = requestAnimationFrame(tick); paint();
  });
  a.addEventListener('pause', () => { if (SYNC === S && !S.done && S.started) $s('syGo').textContent = 'Carry on'; });
  a.addEventListener('play', () => { if (SYNC === S && !S.done) $s('syGo').textContent = 'Pause'; });
  $s('syNow').addEventListener('click', now);
  $s('sySkip').addEventListener('click', skip);
  $s('syBack').addEventListener('click', () => {
    if (S.T.length <= 1) return;
    S.done = false; $s('syDone').hidden = true; $s('syMsg').textContent = '';
    const k = S.T.length - 1; S.T.pop(); S.skip.delete(k); S.diff.delete(k);
    while (S.T.length > 1 && S.T[S.T.length - 1] == null){ const j = S.T.length - 1; S.T.pop(); S.skip.delete(j); }
    const back = S.T[S.T.length - 1] ?? 0; a.currentTime = Math.max(0, back - .3); a.play().catch(() => {}); paint();
  });
  $s('syDiff').addEventListener('click', () => { const k = S.T.length - 1; if (k < 1) return; S.diff.has(k) ? S.diff.delete(k) : S.diff.add(k); paint(); });
  $s('sySlow').addEventListener('click', e => { const on = e.currentTarget.getAttribute('aria-pressed') !== 'true'; e.currentTarget.setAttribute('aria-pressed', String(on)); a.playbackRate = on ? .75 : 1; try { a.preservesPitch = true; } catch (x) {} });
  $s('syOver').addEventListener('click', () => { S.T = [0]; S.skip.clear(); S.diff.clear(); S.done = false; $s('syDone').hidden = true; $s('syMsg').textContent = ''; a.currentTime = 0; a.play().catch(() => {}); paint(); });
  $s('syTry').addEventListener('click', () => { READ_MODE = 'listen'; try { localStorage.setItem('ojo-mode', 'listen'); } catch (e) {} navigate({v:'story', n}); });
  $s('syCopy').addEventListener('click', () => {
    const code = $s('syCode').value, msg = $s('syCopied');
    const fallback = () => { $s('syCode').select(); msg.textContent = 'Select the text above and copy it, then paste it into your chat with Claude.'; };
    try { navigator.clipboard.writeText(code).then(() => { msg.textContent = 'Copied. Paste it into your chat with Claude.'; }, fallback); } catch (e) { fallback(); }
  });
  S.key = e => {
    const t = e.target && e.target.closest ? e.target : document.body;
    if (t.closest('textarea') || !S.started || S.done) return;
    if (e.key === ' ' || (e.key === 'Enter' && !t.closest('button:not(#syNow)'))){ e.preventDefault(); now(); }
  };
  paint();
}

/* ================= routing & page turns ================= */
function parse(h){
  h = (h || '').replace(/^#/, '');
  const m = /^story-(\d+)$/.exec(h);
  if (m && +m[1] >= 1 && +m[1] <= TOTAL) return {v:'story', n:+m[1]};
  if (h === 'contents') return {v:'contents'};
  if (h === 'grown-ups') return {v:'grown'};
  if (h === 'sloka') return {v:'sloka'};
  if (h === 'meet') return {v:'meet'};
  if (h === 'author') return {v:'author'};
  const ms = /^sync-(\d+)$/.exec(h);
  if (ms && +ms[1] >= 1 && +ms[1] <= TOTAL && NARR[+ms[1]]) return {v:'sync', n:+ms[1]};
  return {v:'cover'};
}
const hashOf = r => r.v === 'story' ? 'story-' + r.n : r.v === 'sync' ? 'sync-' + r.n : r.v === 'grown' ? 'grown-ups' : r.v;
let current = null, pendingDir = 0;
function navigate(r, dir = 0){ pendingDir = dir; const h = '#' + hashOf(r); if (location.hash === h) show(r); else location.hash = h; }
addEventListener('hashchange', () => show(parse(location.hash)));
function render(r, popDelay){
  document.body.dataset.view = r.v;
  if (r.v === 'story') renderStory(r.n, popDelay); else if (r.v === 'contents') renderContents(); else if (r.v === 'grown') renderGrown(); else if (r.v === 'sloka') renderSloka(); else if (r.v === 'meet') renderMeet(); else if (r.v === 'author') renderAuthor(); else if (r.v === 'sync') renderSync(r.n); else renderCover();
}
function show(r){
  const dir = pendingDir; pendingDir = 0; const was = current; current = r;
  narrStop(); syncStop(); setAmbience(ambFor(r));
  const spread = document.getElementById('spread');
  const narrow = innerWidth <= 880;
  if (dir && was && was.v === 'story' && spread && !RM){
    if (narrow){
      view.animate([{opacity:1, transform:'translateX(0)'}, {opacity:0, transform:`translateX(${-dir * 50}px)`}], {duration:200, easing:'ease-in'}).onfinish = () => {
        render(r, 220); scrollTo(0, 0);
        view.animate([{opacity:0, transform:`translateX(${dir * 50}px)`}, {opacity:1, transform:'translateX(0)'}], {duration:260, easing:'ease-out'});
      };
      playFx('turn'); return;
    }
    const pages = spread.querySelectorAll('.page'), src = dir > 0 ? pages[1] : pages[0], rc = src.getBoundingClientRect();
    const sh = document.createElement('div'); sh.className = 'turnsheet';
    Object.assign(sh.style, {left:rc.left + 'px', top:Math.max(rc.top, 0) + 'px', width:rc.width + 'px', height:Math.min(rc.height, innerHeight - Math.max(rc.top, 0)) + 'px', transformOrigin:dir > 0 ? '0 50%' : '100% 50%', borderRadius:dir > 0 ? '3px 16px 16px 3px' : '16px 3px 3px 16px'});
    document.body.appendChild(sh); playFx('turn');
    const anim = sh.animate([{transform:'perspective(2200px) rotateY(0deg)', filter:'brightness(1)'}, {transform:`perspective(2200px) rotateY(${dir > 0 ? -90 : 90}deg)`, filter:'brightness(.82)', offset:.5}, {transform:`perspective(2200px) rotateY(${dir > 0 ? -180 : 180}deg)`, filter:'brightness(1)'}], {duration:820, easing:'cubic-bezier(.45,.05,.4,1)'});
    setTimeout(() => { render(r, 520); scrollTo({top:0, behavior:'smooth'}); }, 410);
    anim.onfinish = () => sh.animate([{opacity:1}, {opacity:0}], {duration:160}).onfinish = () => sh.remove();
    return;
  }
  render(r); scrollTo(0, 0);
}
document.getElementById('brand').addEventListener('click', () => navigate({v:'cover'}));
addEventListener('keydown', e => {
  if (!current || current.v !== 'story') return;
  if (e.target.closest && e.target.closest('input,textarea,[role="slider"]')) return;
  if (e.key === 'ArrowRight') document.getElementById('nextBtn')?.click();
  if (e.key === 'ArrowLeft') document.getElementById('prevBtn')?.click();
});

const start = data => {
  if (!location.hash && data && data.h){ location.hash = '#' + data.h; return; }
  show(parse(location.hash));
};
window.claude?.hot?.snapshot?.(() => ({h: current ? hashOf(current) : 'cover'}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
