<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Ojo Treasury</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Baloo+2:wght@500;600;700;800&family=Baloo+Tamma+2:wght@500;600;700;800&display=swap">
<style>
@property --bg1{syntax:'<color>';inherits:true;initial-value:#1c1747}
@property --bg2{syntax:'<color>';inherits:true;initial-value:#3a2a6b}
@property --board{syntax:'<color>';inherits:true;initial-value:#f4b52c}
@property --g{syntax:'<number>';inherits:true;initial-value:0.4}
:root{
  /* Layout idea: an open book on a table that changes colour with each story; the pop-up stage stands on the left page, the read-aloud text sits on the right */
  --night:#1c1747;
  --honey:#f4b52c;
  --rose:#ee7f5f;
  --paper:#fffaf0;
  --ink:#2b2236;
  --sage:#e6efe0;
  --muted:#6d6274;
  --alarm:#b3261e;
  --display:'Baloo 2','Baloo Tamma 2',ui-rounded,'Trebuchet MS',system-ui,sans-serif;
  --kn:'Baloo Tamma 2','Noto Sans Kannada','Tunga','Kannada Sangam MN',sans-serif;
  --body:'Alegreya',Georgia,'Times New Roman',serif;
  --bg1:#1c1747;--bg2:#3a2a6b;--board:#f4b52c;
  --noise:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .32  0 0 0 0 .18  0 0 0 .08 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  color-scheme:light;
  transition:--bg1 .9s ease,--bg2 .9s ease,--board .9s ease;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--body);color:var(--ink);background-color:var(--night);background-image:linear-gradient(165deg,var(--bg1),var(--bg2));background-attachment:fixed;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--honey);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ojosvg{display:block;width:100%;height:100%;overflow:visible}

/* night sky behind cover, contents and seal */
#sky{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity 1s}
body.starry #sky{opacity:1}
#sky i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff6c8;box-shadow:0 0 6px #ffe9a0;animation:tw 3.2s ease-in-out infinite}
@keyframes tw{50%{opacity:.2}}

/* top bar */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:9px;background:rgba(28,23,71,.78);color:#fff;border:0;border-radius:999px;padding:5px 14px 5px 8px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.brand .m{width:24px;height:28px;filter:drop-shadow(0 0 5px rgba(255,200,90,.95))}
.brand b{font-family:var(--display);font-weight:800;font-size:1.08rem;letter-spacing:.01em;line-height:1}
.brand span{font-family:var(--kn);font-size:.84rem;opacity:.8;line-height:1}
.top nav{margin-left:auto;display:flex;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,250,240,.94);color:var(--ink);border:0;border-radius:999px;padding:7px 14px;font-family:var(--display);font-weight:700;font-size:.95rem;line-height:1.2;cursor:pointer;text-decoration:none;box-shadow:0 3px 0 rgba(0,0,0,.2);transition:transform .15s}
.chip:hover{transform:translateY(-2px)}
.chip:active{transform:translateY(1px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.chip svg{width:18px;height:18px;flex:none}
.chip.muted .on,.chip:not(.muted) .off{display:none}
.chip[aria-expanded="true"]{background:var(--night);color:#fff}

/* sounds panel */
.sndpanel{position:fixed;z-index:50;top:62px;right:16px;width:min(400px,calc(100vw - 32px));max-height:calc(100vh - 78px);overflow-y:auto;background:var(--paper) var(--noise);color:var(--ink);border-radius:20px;padding:16px 18px 20px;box-shadow:0 3px 0 #e6d6b6,0 26px 54px -12px rgba(0,0,0,.5)}
.sndpanel[hidden]{display:none}
.sp-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.sp-head h2{margin:0;font-family:var(--display);font-weight:800;font-size:1.4rem}
.sp-x{border:0;background:#efe3c8;border-radius:50%;width:36px;height:36px;display:grid;place-items:center;cursor:pointer}
.sp-x svg{width:16px;height:16px}
.sp-row{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;flex-wrap:wrap;padding:6px 0 12px;border-bottom:2px dashed rgba(120,80,30,.2)}
.sndpanel fieldset{border:0;margin:0;padding:16px 0 6px;min-width:0;transition:opacity .2s}
.sndpanel fieldset + fieldset{margin-top:10px;border-top:2px dashed rgba(120,80,30,.2)}
.sndpanel.off fieldset{opacity:.4;pointer-events:none}
.sndpanel legend{font-family:var(--display);font-weight:800;font-size:1.05rem;padding:0}
.sp-hint{margin:2px 0 9px;font-style:italic;color:var(--muted);font-size:.96rem;line-height:1.35}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.opts label{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 2px #eadcc0;font-family:var(--display);font-weight:700;font-size:.93rem;line-height:1.1;cursor:pointer;transition:transform .12s}
.opts label:hover{transform:translateY(-1px)}
.opts label svg{width:20px;height:20px;flex:none}
.opts input:checked + label{background:var(--night);color:#fff;box-shadow:0 3px 0 #0c0930}
.opts input:focus-visible + label{outline:3px solid var(--honey);outline-offset:2px}
.sw{display:inline-flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;cursor:pointer}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.swt{width:46px;height:26px;border-radius:13px;background:#cbbd9f;position:relative;transition:background .2s;flex:none}
.swt::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.sw input:checked + .swt{background:#3f9a5a}
.sw input:checked + .swt::after{transform:translateX(20px)}
.sw input:focus-visible + .swt{outline:3px solid var(--honey);outline-offset:2px}
.vol{display:flex;align-items:center;gap:8px}
.vol input{width:150px;max-width:44vw;accent-color:var(--night)}
.vol svg{width:18px;height:18px;flex:none}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:1.02rem;line-height:1.35;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--night);margin:2px 0 0;flex:none}
.chk small{display:block;font-style:italic;color:var(--muted);font-size:.92rem}
.sp-now{margin:10px 0 8px;font-size:1rem;line-height:1.4}
@media (max-width:620px){.brand span,.chip .lbl{display:none}.chip{padding:8px 11px}}

/* ---------- cover ---------- */
.cover{min-height:calc(100vh - 64px);display:grid;place-items:center;align-content:center;gap:28px;padding:12px 16px 48px;perspective:1600px}
.book3d{position:relative;width:min(70vw,330px);aspect-ratio:3/4;transform-style:preserve-3d;transform:rotateY(24deg) rotateX(-9deg);transition:transform 1s cubic-bezier(.3,.8,.3,1);--t:34px;cursor:pointer}
.book3d:hover{transform:rotateY(16deg) rotateX(-6deg)}
.book3d.opening{transform:rotateY(4deg) rotateX(-4deg) translateX(18%)}
.bf{position:absolute;inset:0;border-radius:5px 14px 14px 5px}
.b-back{transform:translateZ(calc(var(--t) / -2));background:#150f3c;box-shadow:0 40px 60px -20px rgba(0,0,0,.6)}
.b-page{transform:translateZ(calc(var(--t) / 2 - 3px));inset:4px 6px 4px 2px;background:var(--paper) var(--noise);border-radius:3px 10px 10px 3px;display:grid;place-items:center;text-align:center;padding:28px;font-family:var(--display);color:var(--ink)}
.b-page p{margin:0;font-size:1.1rem;font-weight:700;line-height:1.25}
.b-page small{display:block;margin-top:8px;font-family:var(--body);font-style:italic;font-weight:400;color:var(--muted)}
.b-spine{position:absolute;top:0;bottom:0;left:calc(var(--t) / -2);width:var(--t);transform:rotateY(-90deg);background:linear-gradient(90deg,#110b33,#2b2272 45%,#110b33);display:grid;place-items:center;border-radius:4px}
.b-spine span{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--display);font-weight:800;letter-spacing:.14em;font-size:.72rem;color:var(--honey)}
.b-top{position:absolute;left:3px;right:6px;top:calc(4px - (var(--t) - 4px) / 2);height:calc(var(--t) - 4px);transform:rotateX(90deg);background:repeating-linear-gradient(0deg,#fbf3df 0 2px,#e7d9bc 2px 3px)}
.b-edge{position:absolute;top:4px;bottom:4px;right:calc(4px - (var(--t) - 4px) / 2);width:calc(var(--t) - 4px);transform:rotateY(90deg);background:repeating-linear-gradient(90deg,#fbf3df 0 2px,#e7d9bc 2px 3px)}
.b-front{transform:translateZ(calc(var(--t) / 2));transform-origin:0 50%;transform-style:preserve-3d;transition:transform 1.25s cubic-bezier(.6,.04,.3,1)}
.book3d.opening .b-front{transform:translateZ(calc(var(--t) / 2)) rotateY(-168deg)}
.b-front .face{position:absolute;inset:0;border-radius:5px 14px 14px 5px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.b-front .outer{background:radial-gradient(90% 60% at 50% 46%,#3a2f8c,#1d165a 70%,#150f42);box-shadow:inset 0 0 0 7px #1b1450,inset 0 0 0 9px rgba(244,181,44,.55);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:26px 18px 22px;text-align:center;color:#fff}
.b-front .inner{transform:rotateY(180deg);background:#f4b52c;background-image:radial-gradient(circle,rgba(255,255,255,.35) 2px,transparent 2.5px);background-size:22px 22px}
.cv-kn{font-family:var(--kn);font-weight:600;font-size:1rem;color:#ffe2a0;letter-spacing:.02em}
.cv-art{position:relative;width:52%;aspect-ratio:1/1.05;display:grid;place-items:center}
.cv-arch{position:absolute;inset:0;border:3px solid rgba(244,181,44,.75);border-radius:999px 999px 10px 10px;box-shadow:0 0 30px rgba(244,181,44,.25) inset}
.cv-ojo{width:60%;filter:drop-shadow(0 0 18px rgba(255,200,90,.95)) drop-shadow(0 0 40px rgba(255,170,60,.6));animation:bob 3.4s ease-in-out infinite}
.ct-en{font-family:var(--display);font-weight:700}
.cv-knt{margin:4px 0 0;font-family:var(--kn);font-weight:700;font-size:clamp(1.25rem,4.8vw,1.6rem);line-height:1.2;color:#ffe2a0;text-shadow:0 0 16px rgba(244,181,44,.35)}
.cv-title h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(1.7rem,6.6vw,2.35rem);line-height:.98;color:var(--honey);text-shadow:0 2px 0 #8a5a12,0 0 22px rgba(244,181,44,.35);text-wrap:balance}
.cv-sub{margin:0;font-style:italic;font-size:.98rem;color:#e9e3ff}
.cover-cta{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.big{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:16px;padding:13px 22px;font-family:var(--display);font-weight:800;font-size:1.12rem;cursor:pointer;text-decoration:none;background:linear-gradient(#ffd76a,#f4b52c);color:#3a2408;box-shadow:0 5px 0 #b7790f,0 12px 26px rgba(0,0,0,.25);transition:transform .15s}
.big:hover{transform:translateY(-2px)}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #b7790f}
.big.ghost{background:rgba(255,250,240,.12);color:#fff;box-shadow:inset 0 0 0 2px rgba(255,250,240,.5)}
.big.ghost.dark{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px rgba(43,34,54,.35)}

/* ---------- contents ---------- */
.sheet{max-width:1120px;margin:8px auto 40px;padding:0 16px}
.ct{background:var(--paper) var(--noise);border-radius:22px;padding:clamp(20px,4vw,40px);box-shadow:0 3px 0 #eadcc0,0 6px 0 #dfcdab,0 30px 60px -24px rgba(0,0,0,.55)}
.ct-head{display:grid;grid-template-columns:auto 1fr;gap:clamp(14px,3vw,30px);align-items:center;margin-bottom:26px}
.ct-ojo{width:clamp(66px,12vw,110px);filter:drop-shadow(0 0 14px rgba(255,190,80,.9));animation:bob 3.4s ease-in-out infinite}
.ct-kn{margin:0;font-family:var(--kn);font-weight:600;color:#b3721a;font-size:1.05rem}
.ct h1{margin:2px 0 6px;font-family:var(--display);font-weight:800;font-size:clamp(2rem,5vw,3.2rem);line-height:1;color:var(--night);text-wrap:balance}
.lede{margin:0;max-width:60ch;font-size:1.12rem;line-height:1.5;color:#4a3f55}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:18px}
.card{display:flex;flex-direction:column;text-decoration:none;color:var(--ink);background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 0 rgba(0,0,0,.08),0 10px 22px -12px rgba(40,20,60,.45);transform:rotate(var(--tilt,0deg));transition:transform .2s,box-shadow .2s}
.card:nth-child(odd){--tilt:-.8deg}.card:nth-child(even){--tilt:.7deg}.card:nth-child(3n){--tilt:-.3deg}
.card:hover{transform:rotate(0) translateY(-5px);box-shadow:0 2px 0 rgba(0,0,0,.08),0 18px 30px -14px rgba(40,20,60,.55)}
.card-art{position:relative;height:118px;background:linear-gradient(160deg,var(--c1),var(--c2));display:grid;place-items:center}
.card-art svg{width:120px;height:90px;overflow:visible}
.card-kn{position:absolute;left:12px;top:4px;font-family:var(--kn);font-weight:800;font-size:2.1rem;color:rgba(255,255,255,.92);text-shadow:0 2px 0 rgba(0,0,0,.18)}
.card-txt{padding:12px 15px 15px;display:grid;gap:3px}
.card-n{font-family:var(--display);font-weight:600;font-size:.8rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.card h3{margin:0;font-family:var(--display);font-weight:800;font-size:1.2rem;line-height:1.1}
.card p{margin:0;font-style:italic;color:#5a4f63;line-height:1.35}
.ct-foot{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:22px}
.feat{display:grid;grid-template-columns:minmax(200px,300px) 1fr;align-items:center;margin-bottom:20px;--tilt:0deg !important;transform:none}
.feat:hover{transform:translateY(-4px)}
.feat-art{position:relative;height:150px;background:linear-gradient(160deg,#ff9a6b,#ffd36e);display:flex;align-items:flex-end;justify-content:center;gap:0;--g:.9;overflow:hidden}
.feat-art svg{height:140px;width:140px}
.feat-ojo.mg-ojo{position:absolute;right:14%;top:18%;width:56px}
.feat .card-txt{padding:16px 22px}
.feat h3{font-size:1.6rem}
@media (max-width:560px){.feat{grid-template-columns:1fr}}
.alt{flex-direction:row;align-items:center;gap:14px;padding:16px 18px;background:var(--sage)}
.alt.seal{background:#1d165a;color:#fff}
.alt.seal p{color:#d9d2ff}
.alt .ai{width:46px;height:52px;flex:none}
.alt h3{font-size:1.15rem}

/* ---------- the open book ---------- */
.book{max-width:1140px;margin:6px auto 30px;padding:0 18px;perspective:2400px}
.spread{position:relative;display:grid;grid-template-columns:1fr 1fr;transform:rotateX(4deg);transform-origin:50% 0;transform-style:preserve-3d}
.spread::before{content:"";position:absolute;inset:-11px -13px -18px;border-radius:22px;background:var(--board);box-shadow:0 34px 60px -22px rgba(0,0,0,.5),inset 0 0 0 2px rgba(255,255,255,.18);transform:translateZ(-3px)}
.page{position:relative;background-color:var(--paper);background-image:var(--noise);padding:22px 24px 26px;box-shadow:0 2px 0 #efe4cf,0 4px 0 #e6d8bd,0 6px 0 #dccaa7,0 8px 0 #d2bd97}
.page.l{border-radius:16px 3px 3px 16px;background-image:linear-gradient(to left,rgba(90,55,20,.2),rgba(90,55,20,0) 8%),var(--noise)}
.page.r{border-radius:3px 16px 16px 3px;background-image:linear-gradient(to right,rgba(90,55,20,.2),rgba(90,55,20,0) 8%),var(--noise);padding:30px clamp(22px,3.4vw,46px) 26px}
.stick{position:sticky;top:70px}
@media (max-width:880px){
  .book{padding:0 12px}
  .spread{grid-template-columns:1fr;transform:none}
  .page.l{border-radius:16px 16px 3px 3px;background-image:linear-gradient(to top,rgba(90,55,20,.16),rgba(90,55,20,0) 6%),var(--noise);padding:14px 14px 18px}
  .page.r{border-radius:3px 3px 16px 16px;background-image:linear-gradient(to bottom,rgba(90,55,20,.16),rgba(90,55,20,0) 5%),var(--noise)}
  .stick{position:static}
}

/* ---------- pop-up stage ---------- */
.stage{position:relative;aspect-ratio:1/1;border-radius:14px;overflow:hidden;perspective:900px;perspective-origin:50% 30%;background:radial-gradient(130% 90% at 50% 0%,#fffdf6,#f6ead2);box-shadow:inset 0 0 0 1px rgba(120,80,30,.12);--g:.4;transition:--g .5s ease}
.stage.dragging{transition:--g .12s linear}
.floor{position:absolute;left:0;right:0;bottom:0;height:24%;background:linear-gradient(rgba(0,0,0,.12),rgba(0,0,0,0) 22%),var(--floor,#e9d7b1)}
.floor svg{position:absolute;inset:0;width:100%;height:100%}
.layers{position:absolute;inset:0;transform-style:preserve-3d}
.layer{position:absolute;transform-origin:50% 100%;transform:translateZ(var(--z)) rotateX(var(--r,0deg));transition:transform 1s cubic-bezier(.17,.9,.24,1.14) var(--d,0ms);filter:drop-shadow(0 9px 7px rgba(50,25,10,.3))}
.stage:not(.popped) .layer{--r:86deg}
.stage.instant .layer{transition:none}
.layer.back{--z:-170px;left:5%;right:5%;top:2%;bottom:21%;border-radius:18px 18px 6px 6px;overflow:hidden;--d:0ms}
.layer.mid{--z:-70px;left:-2%;right:-2%;bottom:12%;height:76%;--d:170ms}
.layer.front{--z:22px;left:0;right:0;bottom:3%;height:75%;--d:340ms}
.layer svg{display:block;width:100%;height:100%}
.stage[data-mood="grey"] .layer{filter:drop-shadow(0 9px 7px rgba(50,25,10,.3)) saturate(calc(.12 + var(--g) * 1)) brightness(calc(.86 + var(--g) * .18))}
.shade{position:absolute;inset:0;pointer-events:none;background:#0a0924;opacity:0}
.stage[data-mood="night"] .shade{opacity:calc(.84 - var(--g) * .74)}
.light{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--ox) var(--oy),rgba(255,210,120,.95),rgba(255,176,70,.4) 20%,rgba(255,170,60,0) 55%);mix-blend-mode:screen;opacity:calc(var(--g) * .45)}
.stage[data-mood="night"] .light{opacity:calc(var(--g) * .95)}
.ojo{position:absolute;left:var(--ox);top:var(--oy);width:var(--osz,15%);aspect-ratio:100/115;transform:translate(-50%,-50%) scale(calc(.6 + var(--g) * .5));pointer-events:none;opacity:1;transition:opacity .6s .95s}
.stage:not(.popped) .ojo{opacity:0;transition:none}
.ojo .bob{position:relative;width:100%;height:100%;animation:bob 3.2s ease-in-out infinite}
.ojo.tremble .bob{animation:tremble .16s linear infinite}
.ojo .halo{position:absolute;inset:-75%;border-radius:50%;background:radial-gradient(circle,rgba(255,216,120,.95),rgba(255,172,60,.42) 34%,rgba(255,170,60,0) 66%);opacity:calc(.1 + var(--g) * .9)}
.ojo .ojosvg{position:relative;filter:brightness(calc(.48 + var(--g) * .72)) saturate(calc(.35 + var(--g) * .8)) drop-shadow(0 0 calc(var(--g) * 12px) rgba(255,200,90,.95))}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7%)}}
@keyframes tremble{0%{transform:translate(0,0)}25%{transform:translate(2%,-1%)}50%{transform:translate(-2%,1%)}75%{transform:translate(1%,1%)}100%{transform:translate(0,0)}}
.stage-tools{position:absolute;left:10px;right:10px;bottom:10px;display:flex;justify-content:space-between;align-items:flex-end;gap:8px;pointer-events:none}
.tapnote{pointer-events:none;background:rgba(255,250,240,.92);border-radius:10px;padding:5px 10px;font-family:var(--display);font-weight:700;font-size:.85rem;line-height:1.2;box-shadow:0 2px 0 rgba(0,0,0,.15);max-width:60%}
.replay{pointer-events:auto;display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:6px 12px;background:rgba(28,23,71,.82);color:#fff;font-family:var(--display);font-weight:700;font-size:.85rem;cursor:pointer}
.replay svg{width:16px;height:16px}

/* SVG details inside scenes */
svg .flick{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.5s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1,1)}40%{transform:scale(.9,1.1)}70%{transform:scale(1.06,.95)}}
svg .hh{transform-box:fill-box;transform-origin:50% 100%}
.stage.beat svg .hh{animation:beat .9s ease-in-out 4}
@keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.2)}28%{transform:scale(1)}42%{transform:scale(1.13)}}
svg .hop{transform-box:fill-box;transform-origin:50% 100%}
.stage.chirp svg .hop{animation:hop .45s ease-in-out 5}
@keyframes hop{50%{transform:translateY(-9px)}}
svg .flapg{cursor:pointer;transform-box:fill-box;transform-origin:var(--fo,50% 100%);transition:transform .85s cubic-bezier(.3,1.3,.4,1),opacity .6s}
svg .flapg.lifted{transform:var(--ft)}
svg .flapg.phone.lifted{opacity:0;pointer-events:none}
svg .flapg:focus{outline:none}
svg .flapg:focus-visible > *{stroke:#f4b52c;stroke-width:3}
svg .washable{cursor:pointer}
svg .washable:focus{outline:none}
svg .steam{opacity:0;transform-box:fill-box;transition:opacity .8s .4s}
.stage.revealed svg .steam{opacity:.9;animation:steam 2.4s ease-in-out infinite}
@keyframes steam{50%{transform:translateY(-6px)}}
svg .dirt{transition:opacity .7s}
.stage.washed svg .dirt{opacity:0}
svg .bub2{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.3);transition:opacity .5s,transform .7s cubic-bezier(.3,1.4,.4,1)}
.stage.washed svg .bub2{opacity:1;transform:scale(1)}
svg .tw{animation:tw 2.8s ease-in-out infinite}
svg .burst{transform-box:fill-box;transform-origin:center;animation:burst 1.8s ease-out infinite}
@keyframes burst{0%{transform:scale(.4);opacity:0}25%{opacity:1}100%{transform:scale(1.15);opacity:0}}
svg .glide{transform-box:fill-box;transform-origin:center;animation:glide 6s ease-in-out infinite}
@keyframes glide{50%{transform:translate(26px,8px) rotate(6deg)}}
svg .gate{transition:opacity .3s}
.stage[data-gate] svg .gate{opacity:.35}
.stage[data-gate="1"] svg .g1,.stage[data-gate="2"] svg .g2,.stage[data-gate="3"] svg .g3,.stage[data-gate="4"] svg .g4,.stage[data-gate="5"] svg .g5{opacity:1}

/* ---------- pull-tab ---------- */
.tabslot{margin-top:14px;display:grid;gap:7px}
.tabhead{display:flex;justify-content:space-between;align-items:baseline;gap:6px 12px;flex-wrap:wrap}
.tablabel{font-family:var(--display);font-weight:800;font-size:1rem}
.tabstate{font-style:italic;color:var(--muted);font-size:.98rem}
.track{position:relative;height:48px;border-radius:14px;background:linear-gradient(#e2d0ad,#efe2c6);box-shadow:inset 0 2px 6px rgba(80,50,20,.32)}
.track .rail{position:absolute;left:16px;right:16px;top:50%;height:6px;margin-top:-3px;border-radius:3px;background:linear-gradient(90deg,#3a3157,#a8782a 55%,#ffd76a)}
.track .pip{position:absolute;top:50%;width:4px;height:12px;margin:-6px 0 0 -2px;border-radius:2px;background:rgba(60,40,20,.35)}
.tab{position:absolute;top:5px;left:0;width:66px;height:38px;border:0;border-radius:10px 18px 18px 10px;background:linear-gradient(#ffe08a,#f4b52c);box-shadow:0 3px 0 #b7790f,inset 0 1px 0 rgba(255,255,255,.6);display:grid;place-items:center;touch-action:none;cursor:grab;transition:left .6s cubic-bezier(.34,1.56,.64,1);padding:0}
.tab.dragging{transition:none;cursor:grabbing}
.tab svg{width:30px;height:20px}

/* ---------- story text ---------- */
.kicker{display:flex;align-items:center;gap:10px;margin:0 0 4px;font-family:var(--display);font-weight:700;font-size:.9rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.knum{font-family:var(--kn);font-weight:800;font-size:2rem;line-height:1;letter-spacing:0;color:var(--board);text-transform:none}
.st-title{margin:0 0 18px;font-family:var(--display);font-weight:800;font-size:clamp(2rem,3.4vw,2.8rem);line-height:1.02;color:var(--night);text-wrap:balance}
.story-body{max-width:60ch;font-size:1.27rem;line-height:1.66}
.story-body p{margin:0 0 .78em}
.story-body p:first-child{font-size:1.06em}
.story-body em{font-style:italic}
.refrain{margin:26px 0 0;padding:18px 20px;border-radius:16px;background:linear-gradient(135deg,#fff1cf,#ffe0d3);box-shadow:inset 0 0 0 2px rgba(238,127,95,.25);position:relative}
.refrain figcaption{display:flex;align-items:center;gap:6px;font-family:var(--display);font-weight:700;font-size:.82rem;letter-spacing:.07em;text-transform:uppercase;color:#b0532f;margin-bottom:6px}
.refrain figcaption svg{width:16px;height:16px}
.refrain .kn{margin:0;font-family:var(--kn);font-weight:700;font-size:1.5rem;line-height:1.45;color:#3a2530;text-wrap:balance}
.refrain .rom{margin:6px 0 0;font-style:italic;font-size:1rem;color:#8a5a45}
.refrain .en{margin:4px 0 0;font-size:1.12rem;line-height:1.45;color:#3d2c36}
.mini{margin:28px 0 10px;font-family:var(--display);font-weight:800;font-size:1.15rem}
.flapgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.flap{border:0;padding:0;background:none;cursor:pointer;perspective:900px;text-align:left}
.flap-inner{display:grid;transition:transform .7s cubic-bezier(.3,1.25,.4,1);transform-style:preserve-3d}
.flap[aria-pressed="true"] .flap-inner{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;padding:14px 16px;min-height:112px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;font-size:1.06rem;line-height:1.4}
.face.fr{background:#fff3d6;box-shadow:inset 6px 0 0 var(--board),0 3px 0 rgba(0,0,0,.1);position:relative}
.face.fr::after{content:"";position:absolute;right:0;bottom:0;width:26px;height:26px;border-radius:0 0 14px 0;background:linear-gradient(135deg,#fff3d6 50%,#e7cf9e 50%)}
.face.bk{transform:rotateY(180deg);background:#fff;box-shadow:inset 0 0 0 2px var(--board)}
.face .tap{font-family:var(--display);font-weight:700;font-size:.82rem;color:var(--muted)}
.face .a{font-weight:500}
.extra{margin-top:24px;display:grid;gap:10px}
.btn2{justify-self:start;display:inline-flex;align-items:center;gap:10px;border:0;border-radius:14px;padding:11px 18px;font-family:var(--display);font-weight:800;font-size:1.05rem;cursor:pointer;background:var(--night);color:#fff;box-shadow:0 4px 0 #0c0930;transition:transform .15s}
.btn2:hover{transform:translateY(-2px)}
.btn2:active{transform:translateY(2px);box-shadow:0 1px 0 #0c0930}
.btn2 svg{width:24px;height:24px}
.hint{margin:0;font-style:italic;color:var(--muted)}
.gates{display:flex;flex-wrap:wrap;gap:10px}
.gbtn{width:58px;height:58px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;box-shadow:0 4px 0 rgba(0,0,0,.2);transition:transform .15s}
.gbtn:hover{transform:translateY(-2px)}
.gbtn[aria-pressed="true"]{transform:translateY(-2px) scale(1.08);box-shadow:0 0 0 4px #fff,0 0 0 7px var(--ink)}
.gbtn svg{width:40px;height:40px}
.gout{min-height:1.6em;font-size:1.12rem}
.gout b{font-family:var(--display)}
.gout .kn{font-family:var(--kn);font-weight:700}
.grown{margin-top:26px;background:var(--sage);border-radius:14px;padding:16px 19px;font-size:1.02rem;line-height:1.56;max-width:64ch}
.grown h2{margin:0 0 6px;font-family:var(--display);font-weight:800;font-size:.84rem;letter-spacing:.08em;text-transform:uppercase;color:#3b6a49}
.grown p{margin:0}
.pnav{display:flex;justify-content:space-between;gap:12px;margin-top:28px;padding-top:18px;border-top:2px dashed rgba(120,80,30,.22)}
.pbtn{display:grid;gap:2px;border:0;background:none;cursor:pointer;padding:6px 4px;text-align:left;max-width:48%}
.pbtn.nx{text-align:right;margin-left:auto}
.pbtn small{font-family:var(--display);font-weight:700;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pbtn span{font-family:var(--display);font-weight:800;font-size:1.08rem;line-height:1.15}
.pbtn:hover span{text-decoration:underline;text-decoration-color:var(--board);text-decoration-thickness:3px;text-underline-offset:4px}

/* ---------- meet Ayu and Ojo ---------- */
.meet{background:var(--paper) var(--noise);border-radius:22px;padding:clamp(20px,4vw,42px);box-shadow:0 3px 0 #eadcc0,0 6px 0 #dfcdab,0 30px 60px -24px rgba(0,0,0,.45)}
.meet h1{margin:2px 0 6px;font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,5.4vw,3.4rem);line-height:1;color:var(--night)}
.meet h2{margin:0 0 10px;font-family:var(--display);font-weight:800;font-size:clamp(1.5rem,3vw,1.9rem);line-height:1.1;color:var(--night);text-wrap:balance}
.meet h2 span,.meet h3 span{font-family:var(--kn);font-weight:700;color:#b3721a;margin-left:6px}
.mt-head{margin-bottom:24px}
.mt-pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.mt-card{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 2px 0 rgba(0,0,0,.06),0 16px 30px -20px rgba(40,20,60,.5)}
.mt-pic{height:260px;display:grid;place-items:end center}
.mt-pic.ayu{background:linear-gradient(170deg,#ffd9a8,#ffb38a)}
.mt-pic.ayu svg{height:100%;width:auto}
.mt-pic.ojopic{place-items:center;background:radial-gradient(circle at 50% 45%,#3a2f8c,#1b1452 70%);overflow:hidden;--g:.92}
.mt-txt{padding:20px 22px 22px;font-family:var(--display);font-weight:500;font-size:1.2rem;line-height:1.5}
.mt-txt p{margin:0 0 .55em}
.pop1{font-weight:800;color:#c0561f;font-size:1.3rem}
.mg-ojo{position:relative;width:34%;aspect-ratio:100/115;transform:scale(calc(.62 + var(--g) * .55))}
.mt-pic .mg-ojo{width:30%}
.mg-ojo .halo{position:absolute;inset:-80%;border-radius:50%;background:radial-gradient(circle,rgba(255,216,120,.95),rgba(255,172,60,.42) 34%,rgba(255,170,60,0) 66%);opacity:calc(.1 + var(--g) * .9)}
.mg-ojo .ojosvg{position:relative;filter:brightness(calc(.48 + var(--g) * .72)) saturate(calc(.35 + var(--g) * .8)) drop-shadow(0 0 calc(var(--g) * 14px) rgba(255,200,90,.95));animation:bob 3.2s ease-in-out infinite}
.mt-game{margin-top:30px;background:linear-gradient(160deg,#fff6df,#ffe9d6);border-radius:22px;padding:clamp(18px,3vw,30px)}
.mg-sub{margin:-4px 0 16px;font-family:var(--display);font-size:1.1rem;color:var(--muted)}
.mg-play{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin-bottom:18px}
.mg-stage{position:relative;width:min(220px,48vw);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#2e2777,#17124a 72%);display:grid;place-items:center;overflow:hidden;flex:none;transition:--g .6s ease;box-shadow:0 10px 26px -10px rgba(20,10,60,.6)}
.mg-stage .mg-ojo{width:42%}
.mg-stage.sad .mg-ojo .ojosvg{animation:tremble .5s linear 2,bob 3.2s ease-in-out 1s infinite}
.mg-right{flex:1 1 240px;display:grid;gap:8px}
.bubble{position:relative;margin:0;background:#fff;border-radius:18px;padding:16px 18px;font-family:var(--display);font-weight:700;font-size:1.3rem;line-height:1.3;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.bubble::before{content:"";position:absolute;left:-12px;top:26px;border:12px solid transparent;border-right-color:#fff;border-left:0}
@media (max-width:560px){.bubble::before{display:none}}
.mg-hint{margin:0;min-height:1.4em;font-style:italic;font-size:1.05rem;color:#6a4b5c}
.mg-btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.mg-btn{display:flex;align-items:center;gap:10px;border:0;border-radius:14px;padding:10px 14px;background:#fff;cursor:pointer;text-align:left;font-family:var(--display);font-weight:700;font-size:1.02rem;line-height:1.2;box-shadow:inset 0 0 0 2px var(--edge),0 3px 0 rgba(0,0,0,.08);transition:transform .15s}
.mg-btn.good{--edge:#9fd3ae}.mg-btn.dim{--edge:#f2b2a8}
.mg-btn:hover{transform:translateY(-2px)}
.mg-btn[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--night),0 3px 0 rgba(0,0,0,.08)}
.mg-btn svg{width:40px;height:40px;flex:none}
.mt-family{margin-top:30px}
.mf-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.mf-card{display:flex;align-items:center;gap:14px;background:#fff;border-radius:18px;padding:12px 18px 12px 6px;box-shadow:0 2px 0 rgba(0,0,0,.06)}
.mf-card svg{width:110px;height:150px;flex:none}
.mf-card h3{margin:0 0 4px;font-family:var(--display);font-weight:800;font-size:1.35rem}
.mf-card p{margin:0;font-family:var(--display);font-weight:500;font-size:1.08rem;line-height:1.45}
.mt-song{margin-top:30px;background:#1d165a;color:#fff;border-radius:22px;padding:clamp(20px,3vw,32px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(330px,100%),1fr));gap:6px 30px}
.mt-song h2{grid-column:1/-1;color:var(--honey)}
.song{margin:0 0 10px;font-family:var(--display);font-weight:600;font-size:clamp(1.08rem,2.6vw,1.3rem);line-height:1.55}
.meet .cover-cta{margin-top:30px;justify-content:flex-start}

/* ---------- author ---------- */
.author .au-top{display:grid;grid-template-columns:auto 1fr;gap:clamp(16px,3vw,30px);align-items:center;margin:18px 0 8px}
.au-photo{position:relative;width:clamp(130px,19vw,200px);aspect-ratio:3/4;margin:0}
.au-photo img{display:block;width:100%;height:100%;object-fit:cover;border-radius:18px;box-shadow:0 3px 0 #e2e6d6,0 18px 30px -14px rgba(0,0,0,.4)}
.au-badge{position:absolute;right:-12px;bottom:-12px;width:50px;height:50px;border-radius:50%;background:radial-gradient(circle,#3a2f8c,#1b1452 72%);display:grid;place-items:center;--g:.9;box-shadow:0 0 0 4px #fbfaf4}
.au-badge .mg-ojo{width:50%}
.au-mark{width:clamp(84px,13vw,120px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#3a2f8c,#1b1452 72%);display:grid;place-items:center;--g:.9}
.au-mark .mg-ojo{width:46%}
.gp .au-name{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(2rem,4.4vw,2.8rem);line-height:1;color:var(--night)}
.gp .au-role{margin:8px 0 0;color:#4a5a4d;font-size:1.08rem;line-height:1.5}
.au-facts{display:grid;grid-template-columns:max-content 1fr;gap:8px 20px;margin:0;font-size:1.06rem}
.au-facts dt{font-family:var(--display);font-weight:700;font-size:.84rem;letter-spacing:.07em;text-transform:uppercase;color:#56705c;padding-top:3px}
.au-facts dd{margin:0}
@media (max-width:560px){.au-facts{grid-template-columns:1fr}.au-facts dd{margin-bottom:6px}}
.author address{font-style:normal;font-size:1.08rem;line-height:1.6;background:#fff;border-radius:14px;padding:14px 18px;box-shadow:0 2px 0 rgba(0,0,0,.06)}
.author address a{color:#2f6a43;font-weight:700}

/* ---------- reading modes ---------- */
.readbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin:0 0 20px;padding:10px 12px;border-radius:16px;background:#fff3d6;box-shadow:inset 0 0 0 2px rgba(244,181,44,.35);z-index:6}
.page.r[data-mode="listen"] .readbar{position:sticky;top:62px;box-shadow:inset 0 0 0 2px rgba(244,181,44,.35),0 10px 18px -12px rgba(60,40,10,.35)}
.seg{display:inline-flex;background:#fff;border-radius:13px;padding:3px;box-shadow:inset 0 0 0 2px #eadcc0}
.segb{display:inline-flex;align-items:center;gap:7px;border:0;background:none;border-radius:10px;padding:8px 13px;font-family:var(--display);font-weight:800;font-size:1rem;line-height:1.1;cursor:pointer;color:var(--ink)}
.segb svg{width:20px;height:20px;flex:none}
.segb[aria-pressed="true"]{background:var(--night);color:#fff}
.player{display:none;align-items:center;gap:8px;flex-wrap:wrap}
.page.r[data-mode="listen"] .player{display:flex}
.pp{width:46px;height:46px;border-radius:50%;border:0;background:linear-gradient(#ffd76a,#f4b52c);box-shadow:0 3px 0 #b7790f;display:grid;place-items:center;cursor:pointer;flex:none}
.pp:active{transform:translateY(2px);box-shadow:0 1px 0 #b7790f}
.pp svg{width:20px;height:20px}
.pp2{display:inline-flex;align-items:center;gap:5px;border:0;background:#fff;border-radius:999px;padding:8px 12px;font-family:var(--display);font-weight:700;font-size:.9rem;cursor:pointer;box-shadow:inset 0 0 0 2px #eadcc0}
.pp2[aria-pressed="true"]{background:var(--night);color:#fff;box-shadow:none}
.pp2 svg{width:16px;height:16px}
.who{font-style:italic;color:var(--muted);font-size:.95rem;line-height:1.3;flex:1 1 160px}
.selfhint{display:none;margin:0;font-family:var(--display);font-weight:600;font-size:1rem;color:#8a5a20}
.page.r[data-mode="self"] .selfhint{display:block}
.page.r[data-mode="self"] .story-body .w{cursor:pointer;border-radius:5px;transition:background .15s}
.page.r[data-mode="self"] .story-body .w:hover{background:rgba(244,181,44,.28)}
.page.r[data-mode="self"] .refrain .kn.can{cursor:pointer}
.story-body .w.said{background:#ffd76a}
.story-body p{border-radius:8px;transition:background .35s,box-shadow .35s}
.story-body p.now{background:#fff0bf;box-shadow:0 0 0 7px #fff0bf}
.refrain.now{box-shadow:inset 0 0 0 3px var(--honey)}
@media (max-width:560px){.who{display:none}.segb{padding:8px 10px}}

.cast{display:flex;flex-wrap:wrap;gap:6px;flex-basis:100%;margin-top:2px}
.castc{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:5px 12px 5px 7px;background:#fff;font-family:var(--display);font-weight:700;font-size:.9rem;cursor:pointer;box-shadow:inset 0 0 0 2px #eadcc0;transition:transform .15s,box-shadow .15s}
.castc i{width:14px;height:14px;border-radius:50%;background:var(--c);flex:none}
.castc.on{box-shadow:inset 0 0 0 2px var(--c),0 0 0 4px rgba(244,181,44,.35);transform:translateY(-2px) scale(1.06)}
.castc.on i{animation:talk .45s ease-in-out infinite alternate}
@keyframes talk{to{transform:scale(1.4)}}
.ojo.flicker .bob{animation:flicker .13s steps(2,end) 10}
@keyframes flicker{50%{opacity:.2}}

.au-note{margin:24px 0 10px;background:#fff7e4;border-radius:18px;padding:22px clamp(18px,3vw,30px) 20px;box-shadow:inset 6px 0 0 var(--honey),0 2px 0 rgba(0,0,0,.05)}
.gp .au-note h2{margin:0 0 12px;font-size:1.3rem;color:#a2601a}
.au-note p{margin:0 0 .75em;font-size:1.18rem;line-height:1.62;max-width:62ch}
.au-note .last{font-family:var(--display);font-weight:800;font-size:1.3rem;line-height:1.3;color:#c0561f;margin-top:4px}
.au-note .au-dear{font-family:var(--display);font-weight:700;font-size:1.2rem;color:#7a4a12}
.au-note .au-sign{margin:0;font-style:italic;color:var(--muted);font-size:1.08rem;line-height:1.5}
.au-note .au-sign span{font-style:normal;font-family:var(--display);font-weight:800;color:var(--ink)}
.cv-by{margin:0;font-family:var(--display);font-weight:600;font-size:.88rem;letter-spacing:.03em;color:#ffe2a0}

/* Ojo's eight drops */
.drops{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;margin-top:16px}
.drop{display:block;width:26px;height:32px;transition:transform .15s}
.drop:hover{transform:translateY(-3px)}
.drop svg,.md svg{display:block;width:100%;height:100%}
.drop svg path,.md svg path{fill:#efe3c8;stroke:#d9b46b;stroke-width:1.5}
.drop.got svg path,.md.got svg path{fill:#f4b52c;stroke:#c98a12}
.drop.got svg,.md.got svg{filter:drop-shadow(0 0 4px rgba(244,181,44,.85))}
.dcap{margin-left:6px;font-family:var(--display);font-weight:700;font-size:1rem;color:#8a5a20}
.dreset{border:0;background:none;padding:2px 4px;font-family:var(--display);font-weight:700;font-size:.9rem;color:var(--muted);text-decoration:underline;cursor:pointer}
.seal-drops{justify-content:center;margin:0 0 26px}
.seal-drops .dcap{color:#ffe2a0}
.seal-drops .drop svg path{fill:rgba(255,255,255,.12);stroke:rgba(255,226,160,.5)}
.seal-drops .drop.got svg path{fill:#f4b52c;stroke:#ffe08a}
.catch{margin-top:28px;display:grid;gap:10px;justify-items:start}

{ title:'The Little Light in Me', hook:'Who lives in your heart?', bg1:'#1d1a4a', bg2:'#46307e', board:'#f4b52c', extra:'heart',
text:`It was night. The little lamp by the window went out.

The room was dark. Ayu pulled her blanket up to her nose.

"Ayyo, I don't like the dark," said Ayu. "I am all alone."

Ajji came in and sat on the bed.

"Illa, illa, kanda," said Ajji. "You are never alone. Someone is with you all the time."

"Who?" asked Ayu.

Ajji put Ayu's hand on Ayu's chest. "Press here. What can you feel?"

*Thum. Thum. Thum.*

"That is your heart," said Ajji. "Inside your heart there is a tiny house. And inside the tiny house lives a tiny light."

Something moved.

A little golden light came out of Ayu's chest. It had two small wings and two bright eyes. Now the whole room was gold!

"Hello, Ayu," it said. "I am Ojo. I live in your heart."

"How long have you lived there?" asked Ayu.

"Since before you were born," said Ojo.

Ayu had some questions.

"If I am naughty, will you go away?"

"No," said Ojo. "I will get small and dim. But I will never go away."

"Will you shout at me?"

"No. I can't shout. I can only shine."

Ayu wanted to test him. "I ate ALL my rice today!" she said.

Ojo's light flickered. He went dim.

Ayu giggled. "Okay, okay. I ate half only."

At once, Ojo shone bright again.

"He knows when I tell the truth!" said Ayu.

"Yes," smiled Ajji. "Ojo is part of you, kanda."

Ayu lay down. The room was dark again. But now she could see a soft gold glow, right where her heart was.

She was not alone any more.

"Goodnight, Ojo," she whispered.`,

{ title:'Up with the Birds', hook:'Wake up with the birds', bg1:'#ff9f7a', bg2:'#ffd98a', board:'#e8743b', extra:'birds',
text:`Very early in the morning, Ojo woke Ayu up.

"Wake up, Ayu!" he whispered.

"But it's still dark," said Ayu. "The sun is not up yet."

"Listen," said Ojo.

Ayu listened. *Tweet, tweet!* The birds were singing. *Clang!* Someone was pulling water from the well. *Moo!* said the cow.

"Everyone is awake!" said Ayu.

She went to the door. Ajji was already sweeping the yard.

"Good morning, Ayu," said Ajji. "This is the best time of the day. It comes before the sun."

"Why is it the best?" asked Ayu.

"The air is cool and fresh," said Ajji. "And your mind is fresh too."

Ayu took a big, deep breath. The air smelled of flowers and wet earth.

Slowly, the sky turned pink. Then orange. Then gold. The sun came up over the trees.

Ayu stretched her arms up high, high, high.

Ojo shone brighter and brighter.

"Why are you shining so much?" asked Ayu.

"Because you woke up early, with the birds," said Ojo. "That makes me happy!"`,

note:`The classical waking hour, brāhma-muhūrta, comes before sunrise, and for most families with school and work it is simply the hour you already wake. The usable instruction is not the clock. It is the first ten minutes. Whatever happens in them sets the rest. If a screen happens in them, that is what the day is built on.` },

{ title:'Ayu Needs the Toilet', hook:'When your body says go, go!', bg1:'#1fa596', bg2:'#a4e6d4', board:'#1f7f76',
text:`Ayu was building a tower with her blocks. A tall, tall tower!

One block. Two blocks. Three blocks… nine blocks!

Then Ayu felt something in her tummy. She needed to go to the toilet.

"Not now," said Ayu. "I'm busy!"

She put on one more block.

Her tummy felt tight. She wriggled. She crossed her legs.

"Later!" said Ayu.

Ojo was sitting on the window. He started to go dim.

"Ojo, why are you going dim?" asked Ayu.

"Your body is talking to you," said Ojo. "It is saying, *I need the toilet!* When you don't listen, your body feels bad. And so do I."

Ayu's tummy felt worse.

So Ayu jumped up and ran to the toilet. Just in time!

*Ahhh.* Ayu felt so much better.

She washed her hands with soap and came back.

Ojo was shining bright again.

"When your body says *go*, go straight away," said Ojo.

"Okay!" said Ayu. "Next time, I won't wait."

Then she built her tower even taller.`,
kt:'s', kl:'ಶೌಚಾಲಯಕ್ಕೆ ಹೋಗಬೇಕು ಅನಿಸಿದರೆ, ತಡ ಮಾಡಬೇಡ.', kr:'Shauchaalayakke hogabeku anisidare, tada maadabeda.', ke:'When you need the toilet, don’t wait.',
flaps:[["What did Ayu's body need?","To go to the toilet!"],["What should you do when your body says go?","Go straight away. Don't wait!"]],
note:`The classical texts treat the holding back of natural urges as a cause of disease in its own right, not a minor matter of manners. In practice this is about never making a child feel that asking to go is an interruption or a nuisance, at home and especially at school, where a child who has been made to feel it is will simply hold on all day. Ask your child's teacher what the rule is.` },

{ title:'Brush, Brush, Brush!', hook:'Fuzzy teeth? Brush them!', bg1:'#46aee6', bg2:'#c9edff', board:'#2b86c4',
text:`In the morning, Ayu's teeth felt fuzzy. Like a woolly sock!

"Yuck," said Ayu. "What is on my teeth?"

"Tiny bits of yesterday's food," said Ojo. "They stayed on your teeth all night."

So Ayu took her toothbrush.

Brush up. Brush down. Brush round and round.

She brushed the teeth at the front. She brushed the teeth at the back.

Then Ayu looked at her tongue in the mirror. It was white!

"Now clean your tongue," said Ojo. "Gently, from the back to the front."

Ayu cleaned her tongue. One, two, three times.

Then she rinsed her mouth with water. *Swish, swish, spit!*

Ayu ran her tongue over her teeth.

Smooth! As smooth as a shiny stone.

Ayu smiled a big, wide smile. And Ojo shone bright.

"Clean teeth and a clean tongue make a happy mouth," said Ojo.`,
kt:'s', kl:'ಬೆಳಿಗ್ಗೆ ಹಲ್ಲು ಉಜ್ಜು, ನಾಲಿಗೆ ಸ್ವಚ್ಛ ಮಾಡು.', kr:'Beligge hallu ujju, naalige swachchha maadu.', ke:'Every morning, brush your teeth and clean your tongue.',
flaps:[["What was on Ayu's teeth in the morning?","Tiny bits of yesterday's food."],["After brushing, what else do we clean?","Our tongue, gently, from the back to the front."]],
note:`Ask your child to run their tongue along their teeth before brushing and again after. A two-year-old who cannot yet follow the sentence understands the difference completely, and brushing becomes a sensation they want rather than an instruction they resist. Tongue cleaning is classical dinacaryā and also simply reduces what causes bad breath. Use a child's tongue cleaner or the back of the brush, gently, never deep enough to gag.` },

{ title:'Splash for Sleepy Eyes', hook:'One, two, three splashes', bg1:'#5cbf5f', bg2:'#dcf2a8', board:'#3c9a49',
text:`Ayu woke up. But her eyes were still sleepy. They would only open a tiny bit.

"Water!" said Ojo.

Ayu went to the tap in the yard. She filled her hands with cool water.

She closed her eyes and splashed the water on her face.

*Splash!* One.

*Splash!* Two.

*Splash!* Three.

Then she opened her eyes wide.

Wow! Everything looked bright and new.

The green leaves looked greener. Ajji's red sari looked redder. The black crow on the wall looked blacker than ever!

Ayu laughed.

"What happened?" she asked.

"Your eyes woke up," said Ojo. "Cool water wakes up sleepy eyes."

Ayu dried her face with a soft towel. And Ojo shone bright.`,
kt:'s', kl:'ತಣ್ಣೀರಿನಿಂದ ಮುಖ ತೊಳೆದರೆ ಕಣ್ಣು ಹೊಳೆಯುತ್ತದೆ.', kr:'Tanneerininda mukha toledare kannu holeyuttade.', ke:'Wash your face with cool water, and your eyes will shine.',
flaps:[["How many splashes did Ayu do?","Three! Splash, splash, splash."],["What did Ayu see after the splashes?","Everything looked bright and new!"]],
note:`Cool, not cold, and clean water only. This is one of the small classical practices that needs no persuading once a child has felt it. The brightening is real, and it is a good first lesson that looking after your body can be a pleasure rather than a duty. If your child's eyes are sticky, red, or crusted shut in the mornings, that is not sleepiness and water is not the answer; see a doctor.` },

{ title:'Ajji’s Oil Massage', hook:'Warm oil and gentle hands', bg1:'#ffc93a', bg2:'#ffefb0', board:'#e09a1f',
text:`It was Saturday. Saturday is oil bath day!

Ajji put a bottle of oil in the sun to make it warm.

Ayu sat on her little wooden stool.

Ajji poured some warm oil into her hands. She rubbed it on Ayu's head, round and round and round.

Then on her forehead. Then on her ears. Then down her arms and down her legs.

Ajji's hands were slow and gentle.

Ayu closed her eyes. She felt warm and sleepy and safe.

A hen walked by. *Cluck, cluck.*

A bird flew round and round, high in the sky.

"Ojo," said Ayu softly. "Where are you?"

"Here," said Ojo. He was lying on Ayu's knee, like a cat in the sun.

"I am warm and happy," he said. "The oil makes your body strong. And Ajji's hands make your heart happy."

After the massage, Ayu had a warm bath. She felt soft and shiny all over.`,
kt:'s', kl:'ಎಣ್ಣೆ ಸ್ನಾನ ಮೈಗೆ ಒಳ್ಳೆಯದು.', kr:'Enne snaana maige olleyadu.', ke:'An oil bath is good for the body.',
flaps:[["Which day is oil bath day?","Saturday!"],["Where did Ojo lie down?","On Ayu's knee, like a cat in the sun."]],
note:`This story is as much about the hands as the oil. Unhurried touch from a familiar adult does measurable things to a small child's state, and abhyaṅga is one of the few health practices that is also twenty minutes of undivided attention. Use plain sesame or coconut oil, warmed in sunlight or a water bath, never on a stove. Keep it off the face and out of eyes and ears. Patch-test a new oil on the forearm first, and skip abhyaṅga altogether over broken or inflamed skin, or when your child has a fever.` },

{ title:'Five Friends Live in Me', hook:'Eyes, ears, nose, tongue and skin', bg1:'#7e5ee0', bg2:'#e6c0ff', board:'#6a49c4', extra:'gates',
text:`"Ayu, did you know you have five friends inside you?" asked Ojo.

"Five friends? Where?" asked Ayu.

"Close your eyes," said Ojo.

Ayu closed her eyes.

"Can you hear me?" asked Ojo.

"Yes! With my ears," said Ayu.

"Your ears are friend number one," said Ojo. "Now open your eyes."

Ayu opened her eyes. She saw the blue sky and the green tree.

"Your eyes are friend number two," said Ojo.

Ayu touched the wall. It felt rough and warm. "My skin is friend number three!" she said.

Ayu sniffed the air. Mmm, dosa! "My nose is friend number four!"

Ayu took a bite of mango. Sweet! "My tongue is friend number five!"

"Yes," said Ojo. "Eyes, ears, nose, tongue and skin. Every day, they tell you all about the world."

"I will take good care of my five friends," said Ayu.

"And they will take good care of you," said Ojo, shining bright.`,
kt:'s', kl:'ಕಣ್ಣು, ಕಿವಿ, ಮೂಗು, ನಾಲಿಗೆ, ಚರ್ಮ — ಇವು ನನ್ನ ಐದು ಗೆಳೆಯರು.', kr:'Kannu, kivi, moogu, naalige, charma — ivu nanna aidu geleyaru.', ke:'Eyes, ears, nose, tongue and skin are my five friends.',
flaps:[["Can you name the five friends?","Eyes, ears, nose, tongue and skin."],["Which friend told Ayu about the dosa?","Her nose!"]],
note:`The five gates are the book's teaching centrepiece. Tap each one above and name it together. Then play a game: close your eyes and take turns saying what you can hear, smell and feel. Being able to notice what is coming in through which sense is the beginning of being able to decide what to let in, and a great deal comes from that later.` },

{ title:'Too Loud!', hook:'Cover your ears!', bg1:'#ff7a3a', bg2:'#ffb6d2', board:'#d9483b',
text:`It was festival time at the temple.

*Boom! Boom! Boom!* Big drums came down the road.

Ayu loved the drums. She ran to the gate to watch.

The drums came closer and closer. *BOOM! BOOM! BOOM!*

Then someone burst crackers. *BANG! BANG! BANG!*

It was too loud. Ayu's ears hurt.

Ojo began to shake.

Ayu put her hands over her ears.

A boy laughed at her. "Scaredy-cat!"

So Ayu took her hands away. The noise hurt her ears again, and Ojo shook even more.

Ayu put her hands back over her ears. Then she took a few steps back, away from the noise.

Now the sound was softer. Ojo stopped shaking.

Ayu watched the whole festival: the drums, the lamps and the dancers. It was beautiful!

Later, Ajji said, "You did the right thing, Ayu."

"But the boy laughed at me," said Ayu.

"Your ears are precious," said Ajji. "Too much noise can hurt them for ever. Covering your ears is not being scared. It is being smart."`,
kt:'s', kl:'ಜೋರು ಸದ್ದು ಬಂದರೆ ಕಿವಿ ಮುಚ್ಚಿಕೋ.', kr:'Joru saddu bandare kivi muchchiko.', ke:'When a sound is too loud, cover your ears.',
flaps:[["Is covering your ears being scared?","No! It is being smart."],["What else did Ayu do to make the noise softer?","She stepped back, away from the noise."]],
note:`Noise-induced hearing loss is permanent and cumulative, and festival crackers and large drums at close range are genuinely loud enough to matter for a small child. The useful thing this story does is make covering your ears look like good sense rather than fear, because the pressure not to is real even at five. Distance helps more than anything else, so watch from further back. If your child's ears ring or sound muffled afterwards, or they stop responding to you from across a room, have their hearing checked.` },

{ title:'Look at Your Plate', hook:'Why rice turns sweet', bg1:'#f2a01f', bg2:'#ffe592', board:'#d98a12',
text:`Every day, Ayu ate her lunch with a phone in front of her.

She watched cartoons and ate. She ate and watched cartoons.

When her plate was empty, she didn't even know what she had eaten!

One day, Amma said, "No phone while eating."

"Not fair!" said Ayu.

"Look at your plate," said Ojo.

So Ayu looked.

There was white rice. There was yellow dal. There was a green chilli on the side. Steam was rising from the food.

Ayu smelled the dal. Mmm! Suddenly she felt really hungry.

She took a little rice in her hand. She chewed it slowly. *Chew, chew, chew.*

"Ojo!" she said. "The rice is getting sweet!"

"Yes," said Ojo. "When you chew slowly, rice turns sweet. It always does."

"I never knew that!" said Ayu.

"Because you were watching the phone," said Ojo.

Ayu ate slowly and tasted everything.

When she finished, her tummy felt just right. Not too full. Not too empty.

And Ojo shone bright.`,
kt:'p', kl:'ಊಟ ಬಲ್ಲವನಿಗೆ ರೋಗವಿಲ್ಲ, ಮಾತು ಬಲ್ಲವನಿಗೆ ಜಗಳವಿಲ್ಲ.', kr:'Oota ballavanige rogavilla, maatu ballavanige jagalavilla.', ke:'One who knows how to eat has no illness. One who knows how to speak has no quarrels.',
flaps:[["What happens to rice when you chew it slowly?","It turns sweet!"],["Why didn't Ayu know that before?","She was watching the phone."]],
note:`The classical rule is to eat with the mind on the food, and the modern finding points the same way: children who eat while watching a screen eat without registering it, and the signal that says enough arrives too late or not at all. If there is one thing in this book worth changing in your house, it is this. Take the screen away from the plate and expect a difficult fortnight. The chewing-turns-sweet discovery in this story is real. Point it out to your child, because it gives them something to be curious about instead of something to obey.` },

{ title:'Hands Have a Secret', hook:'Where does dirt hide?', bg1:'#3f98f2', bg2:'#c4e6ff', board:'#2f7fd6',
text:`Ayu came in from the garden.

"My hands are clean," she said. She held them up. They looked clean.

"Look under your nails," said Ojo.

Ayu looked. Oh! There was mud and dirt under every single nail!

"Hands have a secret," said Ojo. "Dirt hides where you can't see it."

So Ayu went to the tap and took the soap.

She rubbed her palms. She rubbed the backs of her hands. She rubbed between her fingers. She scrubbed under her nails. She washed her thumbs and her wrists too.

She sang her favourite song while she washed, from the start to the end.

Then she rinsed off all the bubbles.

Ayu looked at her hands again. They were clean everywhere, even under the nails!

"Now they are really clean," said Ayu.

"Clean hands keep germs away," said Ojo. And he shone bright.`,
kt:'s', kl:'ಊಟಕ್ಕೆ ಮೊದಲು ಸಾಬೂನಿನಿಂದ ಕೈ ತೊಳೆ.', kr:'Ootakke modalu saabooninda kai tole.', ke:'Before you eat, wash your hands with soap.',
flaps:[["Where does dirt hide?","Under the nails and between the fingers."],["How long should you wash your hands?","As long as singing a whole song."]],
note:`Handwashing with soap is one of the highest-value things a small child can learn, particularly before eating and after the toilet, and the part everyone skips is between the fingers and under the nails. The useful trick is time, not instruction: wash for as long as one whole song. Keep your child's nails short. Tap the hands in the picture to wash them.` },

{ title:'The Broken Blue Cup', hook:'Telling the truth', bg1:'#7d829c', bg2:'#cfd1e0', board:'#666b85',
text:`Ayu was playing in the kitchen. Her elbow hit the little blue cup.

*Crash!* The cup broke into pieces.

Ayu was scared. Quickly, she hid the pieces under the mat.

Then Amma came in. "Ayu, where is the blue cup?"

"I don't know," said Ayu.

Amma went away. Nobody saw. Nobody knew.

But Ayu did not feel happy. She felt heavy inside. Even the room looked grey.

Ayu looked for Ojo. He was very small and very dim.

"Ojo, are you cross with me?" she asked.

"No," said Ojo softly. "I am not cross. But when you don't tell the truth, I can't shine."

Ayu sat quietly for a long time.

Then she got up and went to Amma.

"Amma," she said. "I broke the blue cup. It was an accident. I hid it under the mat. I'm sorry."

Amma gave her a big hug. "Thank you for telling me the truth, Ayu. Come, let's clean it up together."

At once, Ayu felt light. The room looked bright again.

And Ojo shone so bright!

"Telling the truth makes me shine," said Ojo.`,
kt:'s', kl:'ನಿಜ ಹೇಳಿದರೆ ಮನಸ್ಸು ಹಗುರವಾಗುತ್ತದೆ.', kr:'Nija helidare manassu haguravaaguttade.', ke:'Tell the truth, and your heart feels light.',
flaps:[["What did Ayu hide under the mat?","The broken blue cup."],["What did Amma say when Ayu told the truth?","“Thank you for telling me the truth.”"]],
note:`This story only works if what Amma does in it is what you do. She hugs her, thanks her for telling, and then they clear it up together. If owning up reliably produces a punishment, a child learns the lesson the story is trying to prevent: that the safest thing is to say nothing. The dimming is Ojo's, not an adult's. Keep it that way when you read it aloud.` },

{ title:'The Sun Sleeps, So Do I', hook:'Ojo grows at night', bg1:'#0e1636', bg2:'#2a4290', board:'#f4b52c',
text:`The sun went down behind the tamarind tree.

The hens went to sleep. The birds went to sleep. Even the cow lay down.

But Ayu said, "I'm not sleepy! Not one bit!"

Ajji switched off the big light.

Ayu lay down on her bed. "I'm still not sleepy," she said. Then she gave a big yawn.

"Ojo," she asked. "What do you do at night?"

"I grow," said Ojo.

"You grow?"

"Yes! When you sleep, your body grows a little bit. And I grow a little bit brighter. Every night!"

"What if I don't sleep?" asked Ayu.

"Then I can't grow," said Ojo. "I just wait for you."

Ayu thought about it. Her eyes felt heavy.

"Okay, Ojo," she whispered. "Let's grow."

And Ayu fell fast asleep.

In the dark, under her blanket, a little gold light grew slowly brighter… and brighter… and brighter.`,
kt:'s', kl:'ಬೇಗ ಮಲಗು, ಬೇಗ ಏಳು.', kr:'Bega malagu, bega elu.', ke:'Sleep early, wake up early.',
flaps:[["When does Ojo grow?","At night, while you sleep."],["What did the hens do when the sun went down?","They went to sleep!"]],
note:`“Ojo grows at night” is not only a story. Growth hormone is largely released during deep sleep, and sleep is when the day's learning is consolidated, which makes sleep the single most underrated academic help there is, long before any of it looks academic. Hold the bedtime, hold the dark, and keep screens out of the last hour: the light itself delays sleep, and the content wakes the mind up. That includes this book. At bedtime, read the printed copy.` },

{ title:'Thank You, Tummy', hook:'Leave a little space', bg1:'#e25670', bg2:'#ffc66e', board:'#d8435f',
text:`Ayu went to a big wedding. There was so much food!

There was rice and payasa. There were vadas and laddus and much, much more.

Every time Ayu's leaf was empty, someone filled it again.

"Eat more, eat more!" said a big auntie.

So Ayu ate more. And more. And more.

On the way home, Ayu did not feel well. Her tummy was too full. It felt tight, like a drum. She felt hot and heavy and grumpy.

Ojo came out slowly. He was very dim.

"What's wrong, Ojo?" asked Ayu.

"There is a little fire in your tummy," said Ojo. "It turns your food into strength. But it is a small fire."

"What happens if I eat too much?" asked Ayu.

"Too much food is like too many sticks on a small fire," said Ojo. "The fire can't burn well, and your tummy hurts."

"So how much should I eat?"

"Eat until you are almost full," said Ojo. "Always leave a little space."

The next day, Ayu ate her lunch slowly. When her tummy felt almost full, she stopped.

She patted her tummy. "Thank you, tummy," she said.

And Ojo shone gold and bright.`,
kt:'p', kl:'ಅತಿಯಾದರೆ ಅಮೃತವೂ ವಿಷ.', kr:'Atiyaadare amruthavoo visha.', ke:'Too much of anything, even nectar, turns to poison.',
flaps:[["What is the little fire in your tummy for?","It turns your food into strength."],["How much should you eat?","Until you are almost full. Leave a little space."]],
note:`This is the story the grown-ups' section of this book exists for. The single most useful idea in Ayurvedic nutrition is that the correct quantity of food is set by the strength of the individual's digestion and not by the size of the serving, and the most common way adults override a child's own appetite is with love, at weddings, with a great-aunt's voice. Read “Myths worth letting go of” before the next function.`, noteLink:true }

const PLK = {};

    breeze(t){ if (Math.random() < .55){ const b = 2600 + Math.random() * 1200; osc(c, {f:b, f2:b * 1.4, t, dur:.09, type:'triangle', vol:.02, dest:g}); osc(c, {f:b * 1.1, f2:b * 1.3, t:t + .14, dur:.07, type:'triangle', vol:.015, dest:g}); } return 2.4 + Math.random() * 3; },
    water(t){ const f = 900 + Math.random() * 1400; osc(c, {f, f2:f * 1.7, t, dur:.045, vol:.03, att:.003, dest:g}); return .15 + Math.random() * .5; },

  };

function enterUnit(u){
  const st = BOOK[narr.n - 1], T = narr.T, last = T.length - 1, prevU = narr.u; narr.u = u;
  if (u !== prevU + 1 && st.talk && narr.glow){ let g = null; for (let j = 0; j < Math.min(u - 1, st.talk.length); j++){ const o = st.talk[j][3]; if (o && o.glow != null) g = o.glow; } if (g != null) narr.glow(g); }
  if (u === 0){ narr.idx = 0; mark(null); speaker('n'); hideBubble(); return; }
  if (u === last){ narr.idx = last - 1; mark('k'); speaker('n'); hideBubble(); return; }
  const k = u - 1, ln = st.talk ? st.talk[k] : null;
  narr.idx = k; mark(k);
  if (ln){ const [who, , , o] = ln; speaker(who); if (who !== 'n') showBubble(k); else hideBubble(); lineFx(o, true); }
  else speaker('n');
}
function audioTick(){
  if (!narr.playing || !narr.audio) return;
  if (narr.T){ const u = unitAt(narr.T, narr.audio.currentTime); if (u !== narr.u) enterUnit(u); }
  narr.raf = requestAnimationFrame(audioTick);
}
function audioPlay(){
  if (!narr.audio){
    const a = new Audio(narrSrc(narr.n)); a.preload = 'auto'; narr.audio = a; narr.u = -1;
    a.addEventListener('ended', narrEnd);
    a.addEventListener('error', () => { narr.audio = null; delete NARR[narr.n]; narr.T = null; setWho(); if (narr.playing && TTS){ if (BOOK[narr.n - 1].script) scriptFrom(0); else ttsFrom(0); } });
  }
  const a = narr.audio;
  if (narr.seek != null){ const go = () => { if (narr.seek != null){ a.currentTime = narr.seek; narr.seek = null; narr.u = -1; } }; if (a.readyState >= 1) go(); else a.addEventListener('loadedmetadata', go, {once:true}); }
  a.playbackRate = narr.slow ? .85 : 1; try { a.preservesPitch = true; } catch (e) {}
  cancelAnimationFrame(narr.raf);
  a.play().then(() => { narr.raf = requestAnimationFrame(audioTick); }).catch(() => { narr.playing = false; duck(false); setPP(); });
}
function setMode(m){
  READ_MODE = m; try { localStorage.setItem('ojo-mode', m); } catch (e) {}
  const tp = document.getElementById('textpage'); if (tp) tp.dataset.mode = m;
  document.querySelectorAll('.segb').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === m)));
  if (m === 'self'){ narrStop(); mark(null); } else narrPlay();
}
document.addEventListener('visibilitychange', () => { if (document.hidden && narr.playing) narrStop(); });

function wireStory(n, sc, st, prevR, nextR, popDelay){
  const stage = document.getElementById('stage'), tab = document.getElementById('tab'), track = document.getElementById('track'), state = document.getElementById('tabstate'), ojo = document.getElementById('ojo');
  let level = sc.def, springT = 0;
  const TW = 66, PAD = 0;
  function place(){ const w = track.clientWidth - TW - PAD * 2; tab.style.left = (PAD + w * level / 7) + 'px'; }
  function setLevel(l, mode){
    const prev = level;
    level = Math.max(0, Math.min(7, Math.round(l)));
    stage.style.setProperty('--g', (level / 7).toFixed(3));
    place();
    tab.setAttribute('aria-valuenow', String(level)); tab.setAttribute('aria-valuetext', LV[level]);
    state.textContent = LV[level];
    if (sc.tremble) ojo.classList.toggle('tremble', level <= 2);
    if (mode !== 'quiet' && level !== prev){ if (level === 7) playGlow(); else if (mode !== 'nostep' && SND.steps) playStep(level); }
  }
  const springBack = (wait = 1400) => { clearTimeout(springT); springT = setTimeout(() => setLevel(sc.def, 'quiet'), wait); };
  const bump = l => { setLevel(l, 'nostep'); springBack(2400); };
  setLevel(sc.def, 'quiet');
  addEventListener('resize', place, {passive:true});

  let drag = null;
  tab.addEventListener('pointerdown', e => {
    e.preventDefault(); clearTimeout(springT);
    drag = {x:e.clientX, moved:false};
    tab.setPointerCapture(e.pointerId); tab.classList.add('dragging'); stage.classList.add('dragging');
  });
  tab.addEventListener('pointermove', e => {
    if (!drag) return;
    if (Math.abs(e.clientX - drag.x) > 4) drag.moved = true;
    const r = track.getBoundingClientRect(), w = r.width - TW;
    const pos = Math.max(0, Math.min(w, e.clientX - r.left - TW / 2));
    tab.style.left = pos + 'px';
    const l = Math.round(pos / w * 7);
    if (l !== level){ level = l; stage.style.setProperty('--g', (l / 7).toFixed(3)); state.textContent = LV[l]; tab.setAttribute('aria-valuenow', String(l)); tab.setAttribute('aria-valuetext', LV[l]); if (sc.tremble) ojo.classList.toggle('tremble', l <= 2); if (l === 7) playGlow(); else if (SND.steps) playStep(l); }
  });
  const end = () => {
    if (!drag) return;
    tab.classList.remove('dragging'); stage.classList.remove('dragging');
    if (!drag.moved){ setLevel(7); springBack(1600); } else { setLevel(level, 'quiet'); springBack(1400); }
    drag = null;
  };
  tab.addEventListener('pointerup', end); tab.addEventListener('pointercancel', end);
  tab.addEventListener('keydown', e => {
    const k = e.key; let l = level;
    if (k === 'ArrowRight' || k === 'ArrowUp') l++; else if (k === 'ArrowLeft' || k === 'ArrowDown') l--; else if (k === 'Home') l = 0; else if (k === 'End') l = 7; else return;
    e.preventDefault(); e.stopPropagation(); clearTimeout(springT); setLevel(l);
  });

  document.getElementById('replay').addEventListener('click', () => pop(stage, 0));
  document.getElementById('prevBtn').addEventListener('click', () => navigate(prevR, -1));
  document.getElementById('nextBtn').addEventListener('click', () => navigate(nextR, 1));
  document.querySelectorAll('.flap').forEach(f => f.addEventListener('click', () => { const on = f.getAttribute('aria-pressed') !== 'true'; f.setAttribute('aria-pressed', String(on)); if (on) playFx('flap'); }));

  const hb = document.getElementById('heartBtn');
  if (hb) hb.addEventListener('click', () => { heartbeat(); stage.classList.remove('beat'); void stage.offsetWidth; stage.classList.add('beat'); bump(6); });
  const bb = document.getElementById('birdBtn');
  if (bb) bb.addEventListener('click', () => { chirps(); stage.classList.remove('chirp'); void stage.offsetWidth; stage.classList.add('chirp'); bump(6); });
  const gout = document.getElementById('gout');
  document.querySelectorAll('.gbtn').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.gbtn').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    const [en, kan, sa, verb] = b.dataset.t.split('|');
    stage.dataset.gate = b.dataset.g;
    gout.innerHTML = `<b>${en}</b> · <span class="kn" lang="kn">${kan}</span> · <i lang="sa-Latn">${sa}</i> — the gate for ${verb}.`;
    playStep(Number(b.dataset.g) + 1);
  }));

  stage.querySelectorAll('[data-act]').forEach(el => {
    const act = () => {
      const a = el.dataset.act;
      if (a === 'phone'){ el.classList.add('lifted'); stage.classList.add('revealed'); bump(6); playFx('flap'); }
      if (a === 'mat'){ const on = el.classList.toggle('lifted'); el.setAttribute('aria-label', on ? 'Put the mat back' : 'Lift the corner of the mat'); playFx('flap'); }
      if (a === 'wash'){ const on = stage.classList.toggle('washed'); if (on){ bump(7); } else playFx('flap'); }
    };
    el.addEventListener('click', act);
    el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); act(); } });
  });

  let sx = 0, sy = 0;
  const tp = document.getElementById('textpage');
  tp.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive:true});
  tp.addEventListener('touchend', e => { const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.6) navigate(dx < 0 ? nextR : prevR, dx < 0 ? 1 : -1); }, {passive:true});

  narr.n = n; narr.idx = 0; narr.audio = null; narr.playing = false; narr.u = -1; narr.seek = null; narr.T = NARR[n] ? narrT(n) : null; setWho(); setPP();
  narr.glow = l => { clearTimeout(springT); setLevel(l, 'nostep'); };
  SB.n = n; SB.i = -1; SB.step = -1; SB.speech = st.talk ? st.talk.map((l, i) => l[0] !== 'n' ? i : -1).filter(i => i >= 0) : []; updTalk();
  const tbStep = d => { if (!SB.speech.length) return; SB.step = SB.step < 0 ? (d > 0 ? 0 : SB.speech.length - 1) : (SB.step + d + SB.speech.length) % SB.speech.length; showBubble(SB.speech[SB.step]); };
  const tPrev = document.getElementById('tbPrev'), tNext = document.getElementById('tbNext');
  if (tPrev){ tPrev.addEventListener('click', () => tbStep(-1)); tNext.addEventListener('click', () => tbStep(1)); }
  document.getElementById('storyBody').addEventListener('click', e => {
    const ln = e.target.closest('[data-i]');
    if (READ_MODE === 'listen' && NARR[n] && narr.T && ln && SND.on){
      const t = narr.T[+ln.dataset.i + 1];
      if (narr.audio){ narr.audio.currentTime = t; narr.u = -1; if (!narr.playing) narrPlay(); }
      else { narr.seek = t; narrPlay(); }
      return;
    }
    const sy = e.target.closest('.say'); if (sy && !narr.playing) showBubble(+sy.dataset.i);
  });
  const cb = document.getElementById('catchBtn');
  cb.addEventListener('click', () => {
    if (DROPS.has(n)) return;
    DROPS.add(n); saveDrops();
    cb.classList.add('got', 'pop'); cb.setAttribute('aria-disabled', 'true');
    document.getElementById('catchTxt').textContent = `You caught drop ${n} of ${TOTAL}!`;
    document.getElementById('mdrops').innerHTML = dropsRow('md', false);
    document.getElementById('catchMsg').textContent = dropsCaption();
    clearTimeout(springT); setLevel(7, 'quiet'); springBack(2600); playGlow();
    if (DROPS.size === TOTAL){ setTimeout(playGlow, 700); setTimeout(playGlow, 1400); }
  });
  tp.querySelectorAll('.castc').forEach(b => b.addEventListener('click', () => {
    if (narr.playing || !TTS || !SND.on) return;
    gestured = true; try { TTS.cancel(); } catch (x) {}
    const w = b.dataset.who; speaker(w); sayAs(w, w === 'o' ? 'bright' : 'warm', CAST[w].sample, () => speaker(null));
  }));
  tp.querySelectorAll('.segb').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
  document.getElementById('ppBtn').addEventListener('click', narrToggle);
  document.getElementById('rsBtn').addEventListener('click', narrRestart);
  document.getElementById('slBtn').addEventListener('click', e => { narr.slow = !narr.slow; e.currentTarget.setAttribute('aria-pressed', String(narr.slow)); try { localStorage.setItem('ojo-slow', narr.slow ? '1' : '0'); } catch (x) {} if (narr.playing){ narrStop(); narrPlay(); } });
  document.getElementById('storyBody').addEventListener('click', e => {
    if (READ_MODE !== 'self' || !TTS || !SND.on) return;
    const w = e.target.closest('.w'); if (!w) return;
    const word = w.textContent.replace(/[^\p{L}\p{N}’'-]/gu, '').replace(/[’']s?$/, m => m.length > 1 ? m : ''); if (!word) return;
    try { TTS.cancel(); } catch (x) {}
    say(SAYFIX(word), 'en', .75, null);
    w.classList.remove('said'); void w.offsetWidth; w.classList.add('said'); setTimeout(() => w.classList.remove('said'), 900);
  });
  const knl = tp.querySelector('.refrain .kn');
  if (knl && pickVoice('kn')){ knl.classList.add('can'); knl.addEventListener('click', () => { if (READ_MODE === 'self' && SND.on){ try { TTS.cancel(); } catch (x) {} say(st.kl, 'kn', .8, null); } }); }
  if (READ_MODE === 'listen' && gestured && SND.on) setTimeout(() => { if (current && current.v === 'story' && current.n === n && !narr.playing) narrPlay(); }, popDelay + 1100);

  pop(stage, popDelay);
}

function pop(stage, delay){
  if (RM){ stage.classList.add('popped'); return; }
  stage.classList.add('instant'); stage.classList.remove('popped'); void stage.offsetWidth; stage.classList.remove('instant');
  setTimeout(() => { stage.classList.add('popped'); playFx('rise'); }, delay + 30);
}
