<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Nidhi's Stories – Ojo's Treasure Trail</title>
  <meta name="description" content="A gentle, ad-free learning app for children aged 3–7: The Ojo Treasury stories, games and healthy daily habits with Ojo as guide." />
  <meta name="theme-color" content="#46307e" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Baloo+Tamma+2:wght@500;600;700;800&display=swap" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Ojo artwork, shared with The Ojo Treasury book -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <radialGradient id="ojoBody" cx="50%" cy="64%" r="62%"><stop offset="0" stop-color="#fffbe2"/><stop offset=".42" stop-color="#ffd86a"/><stop offset="1" stop-color="#f3a02a"/></radialGradient>
      <linearGradient id="ojoWing" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff8dc" stop-opacity=".95"/><stop offset="1" stop-color="#ffc9a3" stop-opacity=".5"/></linearGradient>
    </defs>
    <symbol id="ojo" viewBox="0 0 100 115">
      <path d="M22,66 C4,58 2,36 9,26 C21,33 29,50 28,66Z" fill="url(#ojoWing)"/>
      <path d="M78,66 C96,58 98,36 91,26 C79,33 71,50 72,66Z" fill="url(#ojoWing)"/>
      <path d="M50,5 C59,22 79,43 80,67 C81,92 66,109 50,109 C34,109 19,92 20,67 C21,43 41,22 50,5Z" fill="url(#ojoBody)"/>
      <path d="M50,5 C59,22 79,43 80,67 C81,92 66,109 50,109 C34,109 19,92 20,67 C21,43 41,22 50,5Z" fill="none" stroke="#f08a66" stroke-width="2.4" opacity=".6"/>
      <path d="M50,8 C55,19 61,27 65,35 C58,31 53,28 50,21 C47,28 42,31 35,35 C39,27 45,19 50,8Z" fill="#fff4c4" opacity=".85"/>
      <ellipse cx="40.5" cy="72" rx="6.2" ry="7.6" fill="#2a1830"/><ellipse cx="59.5" cy="72" rx="6.2" ry="7.6" fill="#2a1830"/>
      <circle cx="42.6" cy="69" r="2.3" fill="#fff"/><circle cx="61.6" cy="69" r="2.3" fill="#fff"/>
      <circle cx="32" cy="83" r="4.4" fill="#f27a7a" opacity=".38"/><circle cx="68" cy="83" r="4.4" fill="#f27a7a" opacity=".38"/>
      <path d="M45,86 Q50,90.5 55,86" fill="none" stroke="#2a1830" stroke-width="2.4" stroke-linecap="round"/>
    </symbol>
    <symbol id="drop" viewBox="0 0 24 30">
      <path d="M12 2C15 8 21 13 21 19.5A9 9 0 0 1 3 19.5C3 13 9 8 12 2Z" fill="#f6b52c" stroke="#d98a10" stroke-width="1.4"/>
      <path d="M8.5 18.5a4 4 0 0 0 3 4.5" fill="none" stroke="#fff6cf" stroke-width="2" stroke-linecap="round"/>
    </symbol>
  </svg>

  <header class="topbar" id="topbar">
    <a href="#/" class="brand" aria-label="Ojo's Treasure Trail, home">
      <svg class="brand-ojo" viewBox="0 0 100 115" aria-hidden="true"><use href="#ojo"/></svg>
      <span class="brand-text">Nidhi's Stories</span>
    </a>
    <div class="topbar-right">
      <div class="drops-pill" id="drops-pill" title="Ojas drops" aria-live="polite">
        <svg viewBox="0 0 24 30" aria-hidden="true"><use href="#drop"/></svg>
        <span id="drop-count">0</span><span class="sr-only"> Ojas drops</span>
      </div>
      <a class="me-chip" id="me-chip" href="#/who" aria-label="Who is playing?"></a>
      <button class="lock-btn" id="lock-btn" aria-label="Parent Corner (for grown-ups)">🔒</button>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <nav class="tabbar" id="tabbar" aria-label="Main">
    <a href="#/" data-nav="trail"><span class="tb-icon">🗺️</span><span>Trail</span></a>
    <a href="#/games" data-nav="games"><span class="tb-icon">🎮</span><span>Games</span></a>
    <a href="#/garden" data-nav="garden"><span class="tb-icon">🌼</span><span>Garden</span></a>
    <a href="#/me" data-nav="me"><span class="tb-icon">🙂</span><span>Me</span></a>
  </nav>

  <div id="layer"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/content.js"></script>
  <script src="js/voice-files.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
