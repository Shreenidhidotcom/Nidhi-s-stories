<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gini's Garden</title>
<meta name="description" content="Gini's Garden: moral stories, a simple Ayurveda daily routine and kid-friendly yoga for children aged 4 to 6, in English and Kannada.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A6%9C%3C/text%3E%3C/svg%3E">
<style>
:root{
  --turmeric:#F5B82E; --turmeric-d:#C98D12;
  --leaf:#4CAF50; --leaf-d:#2E7D32;
  --sky:#5BB8F0; --sky-d:#2C86C4;
  --lotus:#F48FB1; --lotus-d:#D2648C;
  --cream:#FFF8E7; --ink:#3B2F2F; --white:#fff;
  --r:26px;
  --font: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Varela Round", "Nunito", "Noto Sans Kannada", "Kannada Sangam MN", "Tunga", system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:var(--font); font-weight:800; color:var(--ink); background:var(--cream);
  background-image:radial-gradient(circle at 8% 12%, #FFE9B0 0 12%, transparent 30%),radial-gradient(circle at 92% 88%, #DDF2D0 0 12%, transparent 32%);
  display:flex; flex-direction:column; height:100dvh; overflow:hidden;
  -webkit-tap-highlight-color:transparent; touch-action:manipulation; user-select:none; -webkit-user-select:none;
}
button{font-family:inherit;font-weight:800;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none}
:focus-visible{outline:4px solid var(--sky-d);outline-offset:3px}

/* ---------- top bar ---------- */
.top{position:relative;z-index:70;background:var(--cream);display:flex;align-items:center;gap:8px;padding:8px max(10px,env(safe-area-inset-right)) 6px max(10px,env(safe-area-inset-left));padding-top:max(8px,env(safe-area-inset-top));flex:none}
.btn{min-height:64px;min-width:64px;border:0;border-radius:22px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:1.15rem;background:var(--white);box-shadow:0 5px 0 rgba(59,47,47,.18);transition:transform .12s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(59,47,47,.18)}
.btn .ic{font-size:1.9rem;line-height:1}
.home-btn{background:var(--turmeric);box-shadow:0 5px 0 var(--turmeric-d);font-size:1.25rem}
.home-btn.here{opacity:.75}
.brand{display:flex;align-items:center;gap:6px;font-size:1.35rem;color:var(--leaf-d);white-space:nowrap}
.brand svg{width:40px;height:44px}
.sp{flex:1}
.stars{min-height:64px;display:flex;align-items:center;gap:4px;padding:0 14px;border-radius:22px;background:#FFF1C2;border:3px solid var(--turmeric);font-size:1.4rem}
.stars.bump{animation:bump .6s}
.sq{padding:0 12px}
.lang{padding:0 6px;gap:0;background:#EAF6FF}
.lang span{padding:10px 10px;border-radius:16px;font-size:1.05rem}
.lang span.on{background:var(--sky);color:#fff}
@media (max-width:760px){ .brand{display:none} }
@media (max-width:560px){
  .top .lbl{display:none} .top{gap:6px} .btn{padding:0 10px} .stars{padding:0 10px;font-size:1.2rem}
  .lang span{padding:8px 7px;font-size:.95rem}
}

/* ---------- Gini guide ---------- */
.guide{display:flex;align-items:center;gap:10px;padding:2px max(12px,env(safe-area-inset-right)) 6px max(12px,env(safe-area-inset-left));max-width:980px;width:100%;margin:0 auto;flex:none}
.gini-btn{border:0;background:none;padding:0;flex:none;width:clamp(62px,11vmin,96px)}
.gini-btn svg{width:100%;height:auto;display:block}
.bubble{position:relative;flex:1;background:var(--white);border:4px solid var(--leaf);border-radius:24px;padding:10px 60px 10px 18px;min-height:64px;display:flex;align-items:center;box-shadow:0 4px 0 rgba(46,125,50,.25)}
.bubble::before{content:"";position:absolute;left:-14px;top:50%;margin-top:-10px;border:10px solid transparent;border-right:14px solid var(--leaf);border-left:0}
.bubble p{margin:0;font-size:clamp(1.1rem,3.3vmin,1.55rem);line-height:1.3}
.replay{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:0;background:#E8F5E9;font-size:1.4rem}
body.kn-silent .bubble p{font-size:clamp(1.25rem,3.8vmin,1.8rem)}
body.kn-silent .replay{opacity:.35}

/* ---------- main ---------- */
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px max(12px,env(safe-area-inset-right)) calc(80px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));outline:none}
.wrap{max-width:980px;margin:0 auto}
.subnav{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.back{background:#F3EFE6}

.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;max-width:820px;margin:0 auto}
@media (orientation:landscape) and (min-width:700px){ .tiles.four{grid-template-columns:repeat(4,1fr);max-width:980px} }
@media (orientation:landscape) and (max-height:520px){ .tiles.four{grid-template-columns:repeat(4,1fr)} .tile{aspect-ratio:1/0.8} }
.tile{border:0;border-radius:30px;aspect-ratio:1/0.92;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--c);color:#fff;font-size:clamp(1.3rem,4vmin,1.9rem);box-shadow:0 7px 0 var(--d),0 12px 22px rgba(0,0,0,.08);transition:transform .15s;position:relative;text-shadow:0 2px 0 rgba(0,0,0,.18);padding:8px}
.tile:active{transform:translateY(5px);box-shadow:0 2px 0 var(--d)}
.tile .art{font-size:clamp(2.6rem,11vmin,5.2rem);line-height:1.05;text-shadow:none;filter:drop-shadow(0 4px 2px rgba(0,0,0,.12))}
.tile .art svg{width:clamp(80px,22vmin,150px);height:auto}
.tile .badge{position:absolute;top:10px;right:12px;font-size:1.4rem;text-shadow:none}
.tiles.small{grid-template-columns:repeat(auto-fill,minmax(min(140px,40vw),1fr));max-width:980px}
.tiles.small .tile{font-size:clamp(1.05rem,3.2vmin,1.4rem);border-radius:24px}

/* ---------- scenes ---------- */
.scene{position:relative;width:min(100%,860px,calc((100dvh - 350px) * 1.667));min-width:min(100%,300px);aspect-ratio:5/3;margin:0 auto;border-radius:var(--r);overflow:hidden;container-type:inline-size;box-shadow:0 6px 0 rgba(0,0,0,.08),0 10px 24px rgba(0,0,0,.08);background:#CFEBFA;border:5px solid #fff}
.scene>svg.bg{position:absolute;inset:0;width:100%;height:100%}
.it{position:absolute;transform:translate(-50%,-50%);line-height:1;pointer-events:none}
.it>span{display:inline-block}
.flip{transform:scaleX(-1)}
.gold{filter:sepia(1) saturate(5) hue-rotate(-12deg) brightness(1.15)}
.silver{filter:grayscale(1) brightness(1.35) contrast(.9)}
.sit{transform:scaleY(.78);transform-origin:bottom}
.navrow{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:12px}
.arrow{min-width:110px}
.next-btn{background:var(--leaf);color:#fff;box-shadow:0 5px 0 var(--leaf-d)}
.dots{display:flex;gap:6px}
.dots i{width:12px;height:12px;border-radius:50%;background:#E4D9C3}
.dots i.on{background:var(--turmeric);transform:scale(1.25)}

/* ---------- choices ---------- */
.choices{display:grid;grid-template-columns:repeat(var(--n,2),1fr);gap:16px;max-width:760px;margin:12px auto 0}
.choice{border:5px solid #fff;border-radius:28px;background:var(--white);min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:clamp(1.15rem,3.4vmin,1.6rem);box-shadow:0 6px 0 rgba(0,0,0,.1);padding:10px}
.choice .em{font-size:clamp(3rem,12vmin,5.5rem);line-height:1}
.choice.right{border-color:var(--leaf);background:#E8F7E4;animation:pop .5s}
.nudge{animation:nudge .6s}
.hintglow{animation:glow 1.4s ease-in-out 2}

/* ---------- Ayurveda word chip ---------- */
.aword{display:inline-flex;align-items:center;gap:8px;border:3px dashed var(--leaf);background:#F1FAEC;border-radius:18px;padding:6px 14px;min-height:56px;font-size:1.05rem}
.aword small{font-size:.75rem;color:var(--leaf-d);display:block;text-align:left;text-transform:uppercase;letter-spacing:.04em}
.aword b{font-size:1.15rem}
.center{text-align:center}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:12px}

/* ---------- healthy day ---------- */
.skybar{position:relative;height:clamp(70px,14vmin,110px);border-radius:24px;overflow:hidden;max-width:860px;margin:0 auto 12px;transition:background 1s;border:4px solid #fff}
.skybar .sunball{position:absolute;font-size:clamp(2.2rem,8vmin,3.4rem);transform:translate(-50%,50%);transition:left 1.2s ease,bottom 1.2s ease}
.skybar .hills{position:absolute;left:0;right:0;bottom:0;height:40%}
.daycard{max-width:860px;margin:0 auto;background:var(--white);border-radius:30px;padding:14px;box-shadow:0 6px 0 rgba(0,0,0,.08);display:flex;flex-direction:column;align-items:center;gap:10px}
.dayart{font-size:clamp(3rem,13vmin,6rem);line-height:1.1;display:flex;gap:.12em;justify-content:center;flex-wrap:wrap}
.dayart span{display:inline-block}
.dayart.act span{animation:wiggle .5s ease-in-out 4}
.dayart.act span:nth-child(2){animation:bounce .5s ease-in-out 4}
.copy{background:var(--lotus);color:#fff;box-shadow:0 5px 0 var(--lotus-d)}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:760px;margin:0 auto 16px}
.slot{aspect-ratio:1;border:4px dashed #D9CBB0;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:clamp(1.8rem,8vmin,3.4rem);color:#C9B994;background:#FFFDF6}
.slot.full{border-style:solid;border-color:var(--leaf);background:#EEF8E8;color:inherit;animation:pop .4s}
.slot small{font-size:clamp(.8rem,2.6vmin,1.1rem);color:var(--ink)}
.cards4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:760px;margin:0 auto}
.cards4 .choice{min-height:0;aspect-ratio:1}
.cards4 .choice.used{visibility:hidden}
@media (max-width:520px){ .cards4{grid-template-columns:repeat(2,1fr)} }

/* ---------- yoga ---------- */
.safety{display:flex;align-items:center;justify-content:center;gap:8px;background:#FFF0F5;border:3px solid var(--lotus);border-radius:18px;padding:8px 14px;max-width:760px;margin:0 auto 12px;font-size:clamp(.95rem,2.8vmin,1.15rem)}
.posewrap{display:flex;flex-direction:column;align-items:center;gap:10px}
@media (orientation:landscape){ .posewrap{flex-direction:row;justify-content:center;align-items:center;gap:28px} .posewrap .ctrl{max-width:46%} }
.stage{position:relative;width:min(84vw,calc(100dvh - 470px),400px);min-width:220px;aspect-ratio:1;background:radial-gradient(circle at 50% 40%,#FFFFFF 0,#FFF3D1 60%,#FFE6A3 100%);border-radius:50%;border:6px solid #fff;box-shadow:0 6px 0 rgba(0,0,0,.08)}
@media (orientation:landscape){ .stage{width:min(44vw,calc(100dvh - 330px),420px)} }
.stage svg.fig{position:absolute;inset:4%;width:92%;height:92%}
.stage .buddy{position:absolute;right:6%;top:6%;font-size:clamp(2rem,8vmin,3.2rem)}
.stage .buzz{animation:orbit 3s linear infinite}
.count{position:absolute;left:2%;top:2%;width:30%;aspect-ratio:1;border-radius:50%;background:rgba(245,184,46,.92);color:#fff;display:none;align-items:center;justify-content:center;font-size:clamp(2.2rem,9vmin,4.4rem);text-shadow:0 3px 0 rgba(0,0,0,.2)}
.count.show{display:flex;animation:pop .45s}
.breathe{position:absolute;left:50%;top:50%;width:70%;aspect-ratio:1;border-radius:50%;border:5px solid rgba(91,184,240,.5);transform:translate(-50%,-50%) scale(.7);display:none}
.breathe.show{display:block;animation:breathe 6s ease-in-out infinite}
.ctrl{display:flex;flex-direction:column;align-items:center;gap:10px}
.stepdots{display:flex;gap:8px}
.stepdots i{width:16px;height:16px;border-radius:50%;background:#E4D9C3}
.stepdots i.on{background:var(--leaf)}
.mini-fig{width:clamp(80px,20vmin,130px);height:auto;background:rgba(255,255,255,.35);border-radius:50%}

/* ---------- memory ---------- */
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:640px;margin:0 auto}
.mgrid.six{max-width:720px}
@media (orientation:landscape) and (max-height:620px){ .mgrid{max-width:min(640px,calc((100dvh - 230px) * 1.9))} .mgrid.six{grid-template-columns:repeat(6,1fr);max-width:min(860px,calc((100dvh - 230px) * 2.8))} }
.mcard{aspect-ratio:3/4;border:0;padding:0;background:none;perspective:600px}
.mcard .in{position:relative;display:block;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.mcard.open .in,.mcard.done .in{transform:rotateY(180deg)}
.mcard .f,.mcard .b{position:absolute;inset:0;border-radius:18px;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 5px 0 rgba(0,0,0,.12)}
.mcard .f{background:var(--leaf);background-image:radial-gradient(circle at 30% 30%,rgba(255,255,255,.25) 0 18%,transparent 19%),radial-gradient(circle at 70% 70%,rgba(255,255,255,.18) 0 14%,transparent 15%);font-size:clamp(1.6rem,6vmin,2.6rem)}
.mcard .b{background:#fff;transform:rotateY(180deg);font-size:clamp(2.2rem,9vmin,3.6rem);border:4px solid var(--turmeric)}
.mcard.done .b{border-color:var(--leaf);background:#EEF8E8}

/* ---------- habit game ---------- */
.bigart{font-size:clamp(4rem,18vmin,8rem);line-height:1.1;text-align:center;background:#fff;border-radius:34px;max-width:520px;margin:0 auto;padding:16px;box-shadow:0 6px 0 rgba(0,0,0,.08)}
.thumbs{display:flex;justify-content:center;gap:24px;margin-top:16px}
.thumb{min-width:140px;min-height:110px;border-radius:30px;font-size:1.3rem;flex-direction:column;gap:2px}
.thumb .ic{font-size:3.4rem}
.thumb.up{background:#E6F6E1;box-shadow:0 6px 0 var(--leaf)}
.thumb.down{background:#E8F3FC;box-shadow:0 6px 0 var(--sky)}
.progress{display:flex;justify-content:center;gap:6px;margin:0 0 10px}
.progress i{width:14px;height:14px;border-radius:50%;background:#E4D9C3}
.progress i.on{background:var(--turmeric)}

/* ---------- stickers ---------- */
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;max-width:760px;margin:0 auto}
@media (max-width:480px){ .sgrid{grid-template-columns:repeat(2,1fr)} }
.sticker{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:clamp(.9rem,2.8vmin,1.15rem);padding:4px}
.sticker .disc{width:100%;max-width:150px;aspect-ratio:1;border-radius:50%;background:var(--c);display:flex;align-items:center;justify-content:center;font-size:clamp(2.6rem,10vmin,4.4rem);border:6px solid #fff;box-shadow:0 6px 0 rgba(0,0,0,.12),inset 0 -8px 0 rgba(0,0,0,.1)}
.sticker.locked .disc{background:#E9E3D6;filter:grayscale(1);opacity:.55}
.sticker.locked .disc span{opacity:.25}

/* ---------- overlays ---------- */
#overlay:empty{display:none}
.ov{position:fixed;inset:0;z-index:50;padding-top:96px!important;background:rgba(255,248,231,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center;overflow:auto}
.ov .bigini{width:clamp(110px,26vmin,190px)}
.ov h1{font-size:clamp(2.4rem,9vmin,4.4rem);margin:0;color:var(--leaf-d)}
.ov p{margin:0;font-size:clamp(1.2rem,3.6vmin,1.7rem)}
.ov .newst{display:flex;align-items:center;gap:12px;background:#fff;border-radius:24px;padding:8px 18px;box-shadow:0 5px 0 rgba(0,0,0,.08)}
.ov .newst .disc{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2.4rem;background:var(--c);border:4px solid #fff;animation:spinin .8s}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.confetti i{position:absolute;top:-30px;width:12px;height:18px;border-radius:4px;animation:fall linear forwards}
.splash .title{font-size:clamp(2.2rem,8vmin,3.8rem);color:var(--leaf-d);margin:0}
.splash .kn{font-size:clamp(1.6rem,6vmin,2.6rem);color:var(--lotus-d)}
.start{background:var(--leaf);color:#fff;box-shadow:0 6px 0 var(--leaf-d);font-size:1.6rem;min-height:84px;padding:0 36px}

/* ---------- grown-ups ---------- */
.gu-btn{position:fixed;right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));z-index:40;border:0;border-radius:999px;padding:8px 14px;font-size:.85rem;font-weight:700;color:#6B5E57;background:conic-gradient(var(--leaf) calc(var(--p,0)*1turn),#fff 0);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.gu-btn span.in{display:block;background:#fff;border-radius:999px;padding:6px 10px}
.gu-btn{padding:4px}
.grown{font-weight:600;max-width:820px;margin:0 auto;background:#fff;border-radius:24px;padding:18px 22px;box-shadow:0 6px 0 rgba(0,0,0,.06);line-height:1.45}
.grown h2{margin:.2em 0 .4em;color:var(--leaf-d)}
.grown h3{margin:1.1em 0 .3em;color:var(--sky-d)}
.grown ul{margin:0;padding-left:1.2em}
.grown li{margin:.25em 0}
.grown .note{background:#FFF4D6;border-radius:14px;padding:10px 14px;margin:10px 0}
.grown .stick-row{display:flex;flex-wrap:wrap;gap:6px}
.grown .stick-row span{background:#F1FAEC;border-radius:12px;padding:4px 10px}
.reset{background:#FCE4EC;box-shadow:0 5px 0 var(--lotus-d);margin-top:12px}
.reset.arm{background:var(--lotus);color:#fff}

/* ---------- animations ---------- */
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8%)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-14%)}}
@keyframes drop{0%{transform:translateY(-60%);opacity:0}30%{opacity:1}100%{transform:translateY(60%);opacity:1}}
@keyframes run{0%{transform:translateX(-30%)}100%{transform:translateX(120%)}}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes nudge{0%,100%{transform:rotate(0)}20%{transform:rotate(-3deg)}40%{transform:rotate(3deg)}60%{transform:rotate(-2deg)}80%{transform:rotate(2deg)}}
@keyframes glow{0%,100%{box-shadow:0 6px 0 rgba(0,0,0,.1)}50%{box-shadow:0 0 0 8px rgba(245,184,46,.55)}}
@keyframes bump{0%,100%{transform:scale(1)}40%{transform:scale(1.3)}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes spinin{from{transform:scale(0) rotate(-180deg)}to{transform:scale(1) rotate(0)}}
@keyframes orbit{from{transform:rotate(0) translateX(-30%) rotate(0)}to{transform:rotate(360deg) translateX(-30%) rotate(-360deg)}}
@keyframes breathe{0%,100%{transform:translate(-50%,-50%) scale(.65)}50%{transform:translate(-50%,-50%) scale(1.05)}}
@keyframes ginibob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(-2deg)}}
@keyframes beak{0%,100%{transform:rotate(0)}50%{transform:rotate(14deg)}}
@keyframes dance{0%,100%{transform:rotate(-6deg) translateY(0)}50%{transform:rotate(6deg) translateY(-8px)}}
.a-bob{animation:bob 2.2s ease-in-out infinite}
.a-wiggle{animation:wiggle 1.4s ease-in-out infinite}
.a-drop{animation:drop 1.6s ease-in infinite}
.a-run{animation:run 2.4s linear infinite}
.a-hop{animation:bounce 1s ease-in-out infinite}
.gini .body{animation:ginibob 2.6s ease-in-out infinite;transform-origin:60px 120px}
.gini.talk .lbeak{animation:beak .28s ease-in-out infinite;transform-origin:88px 47px}
.gini.dance{animation:dance .8s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<header class="top">
  <button class="btn home-btn" id="homeBtn" data-ta="home"><span class="ic">🏠</span><span class="lbl" data-t="home">Home</span></button>
  <div class="brand" id="brand"></div>
  <div class="sp"></div>
  <div class="stars" id="stars" role="status" aria-live="polite"><span aria-hidden="true">⭐</span><b id="starN">0</b></div>
  <button class="btn sq" id="stickBtn" data-ta="stickers"><span class="ic">📒</span><span class="lbl" data-t="stickers">Stickers</span></button>
  <button class="btn sq" id="muteBtn" data-ta="sound"><span class="ic" id="muteIc">🔊</span></button>
  <button class="btn lang" id="langBtn" aria-label="English / ಕನ್ನಡ"><span class="en" lang="en">EN</span><span class="kn" lang="kn">ಕನ್ನಡ</span></button>
</header>
<div class="guide">
  <button class="gini-btn" id="giniBtn" data-ta="say_again"></button>
  <div class="bubble"><p id="bubbleText" aria-live="polite"></p><button class="replay" id="replayBtn" data-ta="say_again">🔊</button></div>

const mem = {};

  get(k, d) { try { const v = localStorage.getItem("gini-" + k); return v == null ? (k in mem ? mem[k] : d) : JSON.parse(v); } catch (e) { return k in mem ? mem[k] : d; } },
  set(k, v) { mem[k] = v; try { localStorage.setItem("gini-" + k, JSON.stringify(v)); } catch (e) { /* storage unavailable: keep in memory */ } }
};

/* ===================== sound (soft Web Audio chimes) ===================== */
let actx = null;
function ac() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } }
  if (actx && actx.state === "suspended") actx.resume().catch(() => {});
  return actx;
}
function tone(freq, start, dur, vol = 0.07, type = "sine", attack = 0.015) {
  if (muted) return;
  const c = ac(); if (!c) return;
  try {
    const o = c.createOscillator(), g = c.createGain(), t0 = c.currentTime + start;
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0 + dur + 0.05);
  } catch (e) {}
}
const SFX = {
  tap() { tone(880, 0, 0.18, 0.04); },
  good() { [784, 988, 1175].forEach((f, i) => tone(f, i * 0.09, 0.55, 0.06, "triangle")); },
  gentle() { tone(523, 0, 0.4, 0.04); tone(659, 0.16, 0.5, 0.04); },
  tick(i) { tone([523, 587, 659, 784, 880][i % 5], 0, 0.7, 0.05); },
  fanfare() { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.12, 0.8, 0.06, "triangle")); tone(1319, 0.52, 1.3, 0.04); }
};
let calmTimer = null;
function calmStart() {
  calmStop();
  const notes = [262, 294, 330, 392, 440, 523, 587];
  const play = () => { tone(notes[Math.floor(Math.random() * notes.length)], 0, 3.4, 0.045, "sine", 0.7); tone(131, 0, 3.6, 0.02, "sine", 1); };
  play(); calmTimer = setInterval(play, 1900);
}
function calmStop() { if (calmTimer) clearInterval(calmTimer); calmTimer = null; }

/* ===================== narration (speech synthesis) ===================== */
const canSpeak = "speechSynthesis" in window && typeof SpeechSynthesisUtterance !== "undefined";
let voices = [];
function loadVoices() { try { voices = speechSynthesis.getVoices() || []; } catch (e) { voices = []; } updateSilent(); }
function voiceFor(l) {
  if (l === "kn") return voices.find(v => /^kn/i.test(v.lang)) || null;
  return voices.find(v => /^en[-_]IN/i.test(v.lang)) || voices.find(v => /^en[-_]GB/i.test(v.lang)) || voices.find(v => /^en/i.test(v.lang)) || null;
}
const hasKn = () => !!voiceFor("kn");
function updateSilent() { document.body.classList.toggle("kn-silent", lang === "kn" && (!canSpeak || !hasKn())); }
if (canSpeak) {
  loadVoices();
  try { speechSynthesis.addEventListener ? speechSynthesis.addEventListener("voiceschanged", loadVoices) : (speechSynthesis.onvoiceschanged = loadVoices); } catch (e) {}
}
function giniTalk(on) { $$(".gini").forEach(g => g.classList.toggle("talk", on)); }
function speak(text) {
  if (!canSpeak || muted) return;
  try {
    speechSynthesis.cancel();
    const v = voiceFor(lang);
    if (lang === "kn" && !v) return;            // no Kannada voice: text only
    const u = new SpeechSynthesisUtterance(text.replace(/[“”"]/g, ""));
    u.lang = lang === "kn" ? "kn-IN" : "en-IN";
    if (v) u.voice = v;
    u.rate = lang === "kn" ? 0.85 : 0.9; u.pitch = 1.15;
    u.onstart = () => giniTalk(true);
    u.onend = u.onerror = () => giniTalk(false);
    speechSynthesis.speak(u);
  } catch (e) {}
}
function hush() { if (canSpeak) { try { speechSynthesis.cancel(); } catch (e) {} } giniTalk(false); }

/* Gini's speech bubble: always shows (and says) what is on screen. */
let curSay = [];
function say(keys) {
  curSay = Array.isArray(keys) ? keys : [keys];
  const dot = (k, i) => (i < curSay.length - 1 && !/[.!?”]$/.test(t(k)) ? "." : "");
  $("#bubbleText").innerHTML = curSay.map((k, i) => tx(k) + dot(k, i)).join(" ");
  speak(curSay.map((k, i) => t(k) + dot(k, i)).join(" "));
}
const resay = () => { if (curSay.length) say(curSay); };

// item: [emoji, x%, y%, size (cqw), classes]
function scene(type, items, extra = "") {

    items.map(([e, x, y, s, c = ""]) => {

const P2 = a => a[0].toFixed(1) + " " + a[1].toFixed(1);
function setFrame(svg, f) {
  const n = f.n, p = f.p, mid = [(n[0] + p[0]) / 2, (n[1] + p[1]) / 2], m = f.m || mid;
  const c = [2 * m[0] - mid[0], 2 * m[1] - mid[1]];
  const sh = [n[0] + (p[0] - n[0]) * 0.12, n[1] + (p[1] - n[1]) * 0.12];
  const q = s => svg.querySelector(s);
  q(".torso").setAttribute("d", `M${P2(n)} Q${P2(c)} ${P2(p)}`);
  q(".ll").setAttribute("d", `M${P2(p)} L${P2(f.lk)} L${P2(f.lf)}`);
  q(".rl").setAttribute("d", `M${P2(p)} L${P2(f.rk)} L${P2(f.rf)}`);
  q(".la").setAttribute("d", `M${P2(sh)} L${P2(f.le)} L${P2(f.lh)}`);
  q(".ra").setAttribute("d", `M${P2(sh)} L${P2(f.re)} L${P2(f.rh)}`);
  q(".nk").setAttribute("d", `M${P2(n)} L${P2(f.h)}`);
  q(".hd").setAttribute("transform", `translate(${P2(f.h)})`);
  const b = q(".belly"), bc = f.bc || mid;
  b.setAttribute("cx", bc[0]); b.setAttribute("cy", bc[1]); b.setAttribute("r", (f.b || 0).toFixed(1));
}
function mixFrame(A, B, k) {
  const o = {};
  new Set([...Object.keys(A), ...Object.keys(B)]).forEach(key => {
    const a = key in A ? A[key] : B[key], b = key in B ? B[key] : A[key];
    o[key] = Array.isArray(a) ? [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k] : a + (b - a) * k;
  });
  return o;
}
let anims = [];
function animate(svg, pose) {
  setFrame(svg, pose.B);
  if (RM) return () => {};
  let raf = 0; const t0 = performance.now();
  const loop = now => { const ph = (1 - Math.cos(((now - t0) / pose.period) * 2 * Math.PI)) / 2; setFrame(svg, mixFrame(pose.A, pose.B, ph)); raf = requestAnimationFrame(loop); };
  raf = requestAnimationFrame(loop);
  const stop = () => cancelAnimationFrame(raf);
  anims.push(stop);
  return stop;
}

/* Grown-ups button: press and hold for 3 seconds. */
(function () {
  const btn = $("#guBtn"); let start = 0, raf = 0;
  const tick = now => {
    const p = Math.min(1, (now - start) / 3000); btn.style.setProperty("--p", p);
    if (p >= 1) { stop(); SFX.good(); go("grown"); return; }
    raf = requestAnimationFrame(tick);
  };
  const begin = e => { if (e) e.preventDefault(); if (raf) return; start = performance.now(); raf = requestAnimationFrame(tick); };
  const stop = () => { cancelAnimationFrame(raf); raf = 0; btn.style.setProperty("--p", 0); };
  btn.addEventListener("pointerdown", begin);
  ["pointerup", "pointerleave", "pointercancel"].forEach(ev => btn.addEventListener(ev, stop));
  btn.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && !e.repeat) begin(e); });
  btn.addEventListener("keyup", stop);
  btn.addEventListener("contextmenu", e => e.preventDefault());
  btn.addEventListener("click", e => { if (!raf) say("gu_hold"); });
})();
